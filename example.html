<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>boxOS example</title>
  <style>
    body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
    label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    textarea, input, button, pre { box-sizing: border-box; font: inherit; }
    textarea, input { width: 100%; padding: .6rem; }
    textarea { min-height: 8rem; font-family: ui-monospace, monospace; }
    button { margin-top: .75rem; padding: .5rem .8rem; }
    pre { min-height: 4rem; padding: 1rem; overflow: auto; background: #f4f4f4; }
  </style>
</head>
<body>
  <h1>boxOS example</h1>
  <p>Register this procedure, then invoke it repeatedly. Its counter is stored in SQLite under the procedure hash and survives server restarts.</p>

  <label for="code">Procedure body</label>
  <textarea id="code">let count = +(ctx.load("count") || "0");
count += 1;
ctx.store("count", "" + count);
return arg + ": " + count;</textarea>
  <button id="register" type="button">Register</button>

  <label for="hash">Procedure hash</label>
  <input id="hash" readonly placeholder="Register a procedure first">

  <label for="shard">Shard</label>
  <input id="shard" value="example-counter">

  <label for="arg">Argument</label>
  <input id="arg" value="persistent count">

  <label for="fuel">Invocation fuel (milliseconds, 1–100)</label>
  <input id="fuel" type="number" min="1" max="100" value="100">
  <button id="invoke" type="button">Invoke</button>

  <h2>Response</h2>
  <pre id="output">Ready.</pre>

  <script type="module">
    import { BoxOSClient } from "https://api.boxos.org/client.js";

    const client = new BoxOSClient("https://api.boxos.org");
    const code = document.querySelector("#code");
    const hash = document.querySelector("#hash");
    const shard = document.querySelector("#shard");
    const arg = document.querySelector("#arg");
    const fuel = document.querySelector("#fuel");
    const output = document.querySelector("#output");

    async function show(action) {
      output.textContent = "Computing proof of work…";
      try {
        const value = await action();
        output.textContent = JSON.stringify({ ok: value }, null, 2);
        return value;
      } catch (error) {
        output.textContent = JSON.stringify({ error: String(error) }, null, 2);
        return undefined;
      }
    }

    document.querySelector("#register").addEventListener("click", async () => {
      const value = await show(() => client.register(code.value));
      if (typeof value === "string") hash.value = value;
    });

    document.querySelector("#invoke").addEventListener("click", () => {
      if (!hash.value) {
        output.textContent = "Register a procedure first.";
        return;
      }
      show(() => client.invokeHash(hash.value, shard.value, arg.value, { fuel: Number(fuel.value) }));
    });
  </script>
</body>
</html>
