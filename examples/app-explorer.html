<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOXOS Apps</title>
<link rel="stylesheet" href="/boxos.css"><script src="/client.js"></script>
<style>
body{max-width:58rem;margin:4rem auto;padding:0 1rem}header{text-align:center;margin-bottom:2rem}nav{display:flex;justify-content:center;gap:.4rem;margin:1.5rem 0}.tab.secondary.active{color:white;background:var(--boxos-accent)}.panel{padding:1.5rem}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}.app{padding:1.2rem;border:1px solid var(--boxos-line);border-radius:.8rem;background:var(--boxos-surface-raised);text-align:left}.app h3{margin:.1rem 0}.app p{min-height:3rem}.app .actions{justify-content:flex-start}.publish{max-width:34rem}.publish label{display:block;text-align:left;margin:.7rem 0}.publish input,.publish textarea{width:100%;margin-top:.3rem}.publish textarea{min-height:5rem}.status{min-height:1.5rem;text-align:center}
</style></head><body>
<a class="app-brand" href="/about">BOXOS</a>
<header class="app-header"><h1>BOXOS Apps</h1><p>Publish immutable apps and keep a personal list of installed shortcuts.</p><button id="login">Login</button><p id="identity"></p></header>
<nav><button class="tab secondary active" data-view="discover">Discover</button><button class="tab secondary" data-view="installed">Installed</button><button class="tab secondary" data-view="publish">Publish</button></nav>
<section class="panel card"><div id="discover" class="view"><h2>Discover apps</h2><div id="catalog" class="apps"></div></div>
<div id="installed" class="view" hidden><h2>Installed apps</h2><div id="installedList" class="apps"></div></div>
<div id="publish" class="view publish" hidden><h2>Publish an app</h2><form id="publishForm">
<label>Name<input id="name" required maxlength="80"></label><label>Immutable app URL<input id="url" required type="url" placeholder="https://…"></label><label>Description<textarea id="description" maxlength="300"></textarea></label><button>Publish app</button></form></div>
<p id="status" class="status muted"></p></section>
<script>
(async function(){
const $=id=>document.querySelector("#"+id),client=new BoxOSClient(),examples=(await client.request("/examples")).examples,explorer=examples.find(x=>x.name==="app-explorer"),wallet=examples.find(x=>x.name==="wallet");if(!explorer?.box||!wallet)throw Error("App Explorer examples are not published");
const app=await client.account(),grantKey="boxos:apps:grant:0.3.0";let authorization;try{authorization=JSON.parse(localStorage.getItem(grantKey)||"null")}catch{}
const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.has("boxos-grant")){const returned=JSON.parse(fragment.get("boxos-grant")),state=sessionStorage.getItem("boxos:apps:state");if(returned.state!==state)throw Error("Wallet response state did not match");const signed=returned.grants.find(x=>x.grant.permission==="apps");if(!signed)throw Error("Wallet did not return apps permission");authorization={account:returned.account,grant:signed.grant,signature:signed.signature};localStorage.setItem(grantKey,JSON.stringify(authorization));history.replaceState(null,"",location.pathname)}
function message(text,error=false){$("status").textContent=text;$("status").classList.toggle("error",error)}
async function publicValue(key,fallback){const found=await client.getPublicState(explorer.box,key);return found.found?found.value:fallback}
async function profileName(account){const profile=examples.find(x=>x.name==="profile");if(!profile?.box)return account.slice(0,12)+"…";const value=await client.getPublicState(profile.box,account);return value.found?value.value.username:account.slice(0,12)+"…"}
async function updateIdentity(){if(!authorization){$("identity").textContent="Login to install or publish apps.";$("login").textContent="Login";return}$("login").textContent="Switch account";$("identity").textContent="Logged in as "+await profileName(authorization.account)}
function card(item,installed){const article=document.createElement("article");article.className="app";const h=document.createElement("h3"),p=document.createElement("p"),actions=document.createElement("div"),open=document.createElement("a");h.textContent=item.name;p.textContent=item.description||"No description.";actions.className="actions";open.className="button secondary";open.href=item.url;open.textContent="Open";actions.append(open);if(authorization){const toggle=document.createElement("button");toggle.textContent=installed?"Uninstall":"Install";toggle.onclick=()=>manage(installed?"uninstall":"install",item);actions.append(toggle);if(item.publisher===authorization.account){const remove=document.createElement("button");remove.className="secondary";remove.textContent="Unpublish";remove.onclick=()=>manage("unpublish",item);actions.append(remove)}}article.append(h,p,actions);return article}
async function render(){const apps=await publicValue("apps",[]),installed=authorization?await publicValue("installed:"+authorization.account,[]):[];$("catalog").textContent="";$("installedList").textContent="";apps.forEach(item=>{$("catalog").append(card(item,installed.includes(item.id)));if(installed.includes(item.id))$("installedList").append(card(item,true))});if(!apps.length)$("catalog").textContent="No apps published yet.";if(!authorization)$("installedList").textContent="Login to see installed apps.";else if(!installed.length)$("installedList").textContent="No apps installed yet."}
async function manage(action,item){if(!authorization)return login();message(action+"…");try{await client.invoke(explorer.box,"manage",{action,app:item,account:authorization.account,grant:authorization.grant,signature:authorization.signature});message("Done.");await render()}catch(e){message(e.message,true)}}
function login(){const state=crypto.randomUUID();sessionStorage.setItem("boxos:apps:state",state);const request={permissions:["apps"],subject:app.publicKey,state,returnUrl:location.origin+location.pathname};location.href=wallet.localUrl+"/?request="+encodeURIComponent(JSON.stringify(request))}
$("login").onclick=login;document.querySelectorAll(".tab").forEach(button=>button.onclick=()=>{document.querySelectorAll(".view").forEach(view=>view.hidden=view.id!==button.dataset.view);document.querySelectorAll(".tab").forEach(tab=>tab.classList.toggle("active",tab===button))});
$("publishForm").onsubmit=async event=>{event.preventDefault();if(!authorization)return login();const url=$("url").value,id=new URL(url).hostname.split(".")[0],item={id,name:$("name").value,url,description:$("description").value};await manage("publish",item);event.target.reset()};
await updateIdentity();await render();
})().catch(e=>{document.querySelector("#status").textContent=e.message});
</script></body></html>
