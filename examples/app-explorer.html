<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOXOS Apps</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#24252a;background:#f5f5f7}*{box-sizing:border-box}main{width:min(58rem,calc(100% - 2rem));margin:6vh auto}header,.toolbar,.tabs,.actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}header h1{margin:0 auto 0 0;font-size:2.5rem}.muted,#message{color:#707078}button{padding:.65rem .85rem;border:0;border-radius:.5rem;background:#4f46d8;color:white;font-weight:600;cursor:pointer}.secondary,.tabs button{background:#e7e7ec;color:#333}.tabs button.active{background:#4f46d8;color:white}.toolbar{margin:1.2rem 0}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1rem}.card,.panel{background:white;border:1px solid #ddd;border-radius:.8rem;padding:1rem}.card{display:flex;flex-direction:column}.card h2{margin:0 0 1rem;font-size:1.15rem}.card small{margin-top:auto;color:#777}.card a{color:#4f46d8}input{width:100%;padding:.7rem;border:1px solid #ccc;border-radius:.5rem;font:inherit}label{display:block;margin:.75rem 0}.panel{margin:1rem 0}.empty{padding:2rem 0;color:#777}[hidden]{display:none!important}
</style>
<main>
  <header><h1>Apps</h1><span id="account"></span><button id="sign-in">Choose account</button><button id="sign-out" class="secondary" hidden>Sign out</button></header>
  <div class="toolbar"><input id="search" placeholder="Search apps"><button id="show-publish">Publish an app</button></div>
  <form id="publish" class="panel" hidden>
    <h2>Publish an app</h2>
    <label>Permanent BOXOS page URL or ID<input id="app-url" required></label>
    <label>Name<input id="app-name" maxlength="80" required></label>
    <button>Publish</button> <button id="cancel-publish" type="button" class="secondary">Cancel</button>
  </form>
  <nav class="tabs"><button id="discover-tab" class="active">All apps</button><button id="installed-tab">Your apps</button><button id="published-tab">Published by you</button></nav>
  <p id="message"></p>
  <section id="apps" class="grid"></section>
</main>
<script type="module">
import { BoxOSClient } from "/client.js";
const boxos = new BoxOSClient();
const stats = await boxos.stats();
const publisher = stats.applications.explorer.publisher;
const installsReducer = stats.applications.explorer.installs;
const profileReducer = stats.profiles.reducer;
const page = await boxos.pageInfo();
const installKey = "app-explorer.install-authorization";
const publishKey = "app-explorer.publish-authorization";
let installAuthorization = stored(installKey);
let publishAuthorization = stored(publishKey);
let records = [];
let installed = [];
let installCounts = new Map();
let tab = "discover";
const profileNames = new Map();
const $ = id => document.getElementById(id);

function stored(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); }
  catch { localStorage.removeItem(key); return null; }
}
function message(value) { $("message").textContent = value; }
async function publicValue(reducer, key) {
  try { return (await boxos.publicState(reducer, key)).value; }
  catch { return undefined; }
}
async function profileName(account) {
  if (profileNames.has(account)) return profileNames.get(account);
  let name = account.slice(0, 12) + "…";
  try { name = (await boxos.publicState(profileReducer, `profile:${account}`)).value.name; } catch {}
  profileNames.set(account, name); return name;
}
async function installInvoke(input) {
  return (await boxos.invoke(installsReducer, input, { authorization: installAuthorization })).ok;
}
async function publishInvoke(input) {
  return (await boxos.invoke(publisher, input, { authorization: publishAuthorization })).ok;
}
async function authorizeInstalls() {
  if (!installAuthorization) {
    installAuthorization = await boxos.authorize(["apps:install"], "Install apps and view your apps", installsReducer);
    localStorage.setItem(installKey, JSON.stringify(installAuthorization));
  }
  await refreshAccount();
}
async function authorizePublishing() {
  if (publishAuthorization) return;
  publishAuthorization = await boxos.authorize(["apps:publish"], "Publish and update apps", publisher);
  localStorage.setItem(publishKey, JSON.stringify(publishAuthorization));
}
async function authorizeAsAuthor(record) {
  if (publishAuthorization?.grant?.account !== record.authorId) {
    publishAuthorization = null; localStorage.removeItem(publishKey); await authorizePublishing();
  }
  if (publishAuthorization.grant.account !== record.authorId) throw new Error("Choose the app's author account.");
}
async function refreshAccount() {
  const signedIn = Boolean(installAuthorization);
  $("sign-in").hidden = signedIn; $("sign-out").hidden = !signedIn;
  if (!signedIn) { $("account").textContent = ""; installed = []; return; }
  $("account").textContent = await profileName(installAuthorization.grant.account);
  try { installed = await installInvoke({ action: "installed" }); }
  catch (error) {
    installAuthorization = null; localStorage.removeItem(installKey); message(error.message); await refreshAccount();
  }
}
async function loadApps() {
  const count = await publicValue(publisher, "publish:counter") || 0;
  const ids = await Promise.all(Array.from({ length: count }, (_, index) => publicValue(publisher, `publish:${index + 1}`)));
  const found = (await Promise.all(ids.reverse().map(id => publicValue(publisher, `app:${id}`)))).filter(Boolean);
  const releases = await Promise.all(found.map(record => publicValue(publisher, `release-counter:${record.appId}`)));
  const pages = await Promise.all(found.map((record, index) => publicValue(publisher, `release:${record.appId}:${releases[index] || 1}`)));
  const unpublished = await Promise.all(found.map(record => publicValue(publisher, `unpublished:${record.appId}`)));
  records = found.map((record, index) => ({
    ...record,
    pageId: pages[index] || record.appId,
    release: releases[index] || 1,
    unpublished: unpublished[index] === true,
  }));
  const counts = await Promise.all(records.map(record => publicValue(installsReducer, `installs:${record.appId}`)));
  installCounts = new Map(records.map((record, index) => [record.appId, counts[index] || 0]));
  await Promise.all(records.map(record => profileName(record.authorId)));
}
function appId(value) {
  const text = value.trim().toLowerCase();
  if (/^[a-z2-7]{16}$/.test(text)) return text;
  try {
    const label = new URL(text).hostname.split(".")[0];
    if (/^[a-z2-7]{16}$/.test(label)) return label;
  } catch {}
  throw new Error("Enter a permanent BOXOS page URL or 16-character page ID.");
}
function card(record) {
  const article = document.createElement("article"); article.className = "card";
  const title = document.createElement("h2"); title.textContent = record.name;
  const creator = document.createElement("a"); creator.href = `/examples/profile?account=${encodeURIComponent(record.authorId)}`; creator.textContent = profileNames.get(record.authorId);
  const count = installCounts.get(record.appId) || 0;
  const details = document.createElement("small"); details.append("By ", creator, ` · release ${record.release} · ${count} install${count === 1 ? "" : "s"}${record.unpublished ? " · unpublished" : ""}`);
  const actions = document.createElement("div"); actions.className = "actions";
  const open = document.createElement("a"); open.href = page.urlTemplate.replace("{id}", record.pageId); open.target = "_blank"; open.rel = "noopener"; open.textContent = "Open";
  const inspect = document.createElement("a"); inspect.href = `/examples/studio?open=${encodeURIComponent(record.pageId)}`; inspect.textContent = "Inspect source";
  const update = document.createElement("a"); update.href = "#"; update.textContent = "Update";
  update.onclick = async event => {
    event.preventDefault();
    try {
      await authorizeAsAuthor(record);
      const value = prompt("Permanent BOXOS page URL or ID for the new release:");
      if (!value) return;
      await publishInvoke({ action: "release", appId: record.appId, pageId: appId(value) });
      await loadApps(); render(); message("Release published.");
    } catch (error) { message(error.message); }
  };
  const publication = document.createElement("a"); publication.href = "#"; publication.textContent = record.unpublished ? "Republish" : "Unpublish";
  publication.onclick = async event => {
    event.preventDefault();
    try {
      await authorizeAsAuthor(record);
      if (!record.unpublished && !confirm(`Unpublish ${record.name}?`)) return;
      await publishInvoke({ action: record.unpublished ? "republish" : "unpublish", appId: record.appId });
      await loadApps(); render(); message(record.unpublished ? "App republished." : "App unpublished.");
    } catch (error) { message(error.message); }
  };
  const install = document.createElement("button");
  const isInstalled = installed.includes(record.appId); install.textContent = isInstalled ? "Uninstall" : "Install";
  install.onclick = async () => {
    try {
      await authorizeInstalls();
      const result = await installInvoke({ action: isInstalled ? "uninstall" : "install", appId: record.appId });
      installed = result.installed; installCounts.set(record.appId, result.installs); render();
    } catch (error) { message(error.message); }
  };
  actions.append(install, open, inspect);
  if (publishAuthorization?.grant?.account === record.authorId || installAuthorization?.grant?.account === record.authorId) actions.append(update, publication);
  article.append(title, details, actions); return article;
}
function render() {
  $("discover-tab").classList.toggle("active", tab === "discover");
  $("installed-tab").classList.toggle("active", tab === "installed");
  $("published-tab").classList.toggle("active", tab === "published");
  const query = $("search").value.trim().toLowerCase();
  let shown;
  if (tab === "installed") shown = records.filter(record => installed.includes(record.appId));
  else if (tab === "published") shown = records.filter(record => record.authorId === publishAuthorization?.grant?.account);
  else shown = records.filter(record => !record.unpublished);
  if (query) shown = shown.filter(record => record.name.toLowerCase().includes(query));
  $("apps").textContent = "";
  for (const record of shown) $("apps").append(card(record));
  if (!shown.length) {
    const empty = document.createElement("p"); empty.className = "empty";
    empty.textContent = tab === "installed" ? "You have not installed any apps." : tab === "published" ? "You have not published any apps." : "No apps published yet."; $("apps").append(empty);
  }
}
$("sign-in").onclick = async () => { try { await authorizeInstalls(); render(); } catch (error) { message(error.message); } };
$("sign-out").onclick = async () => { installAuthorization = null; localStorage.removeItem(installKey); await refreshAccount(); render(); };
$("show-publish").onclick = () => { $("publish").hidden = false; };
$("cancel-publish").onclick = () => { $("publish").hidden = true; };
$("publish").onsubmit = async event => {
  event.preventDefault();
  try {
    await authorizePublishing();
    const pageId = appId($("app-url").value);
    await publishInvoke({ action: "publish", appId: pageId, pageId, name: $("app-name").value.trim() });
    $("publish").reset(); $("publish").hidden = true; await loadApps(); render(); message("App published.");
  } catch (error) { message(error.message); }
};
$("search").oninput = render;
$("discover-tab").onclick = () => { tab = "discover"; render(); };
$("installed-tab").onclick = async () => {
  try { await authorizeInstalls(); tab = "installed"; render(); } catch (error) { message(error.message); }
};
$("published-tab").onclick = async () => {
  try { await authorizePublishing(); tab = "published"; render(); } catch (error) { message(error.message); }
};
await refreshAccount(); await loadApps(); render();
</script>
