<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOXOS Accounts</title>
<style>
:root{font:16px/1.45 system-ui,sans-serif;color:#202124;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem}.card{width:min(28rem,100%);background:white;border:1px solid #dadce0;border-radius:1rem;box-shadow:0 .5rem 2rem #20212412;overflow:hidden}header{padding:2rem 2rem 1rem}h1{font-size:1.5rem;margin:0 0 .4rem}p{margin:.3rem 0;color:#5f6368}.content{padding:1rem 1.25rem 1.5rem}.capabilities{margin:.75rem 0 1rem;padding:.8rem 1rem;background:#f1f3f4;border-radius:.7rem}.capabilities span{display:block;padding:.2rem 0;color:#3c4043}.accounts{display:grid;gap:.35rem}.account,.add{display:flex;width:100%;align-items:center;gap:.8rem;padding:.75rem;border:0;border-radius:.7rem;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}.account:hover,.add:hover{background:#f1f3f4}.avatar{display:grid;place-items:center;width:2.5rem;height:2.5rem;flex:none;border-radius:50%;background:#5b5bd6;color:white;font-weight:650}.add .avatar{background:white;border:1px solid #bdc1c6;color:#5f6368;font-size:1.4rem}.name{font-weight:550}.hint{display:block;color:#777;font-size:.85rem}input,textarea{width:100%;margin:.4rem 0 1rem;padding:.75rem;border:1px solid #bdc1c6;border-radius:.45rem;font:inherit}textarea{min-height:6rem;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}button.primary,button.secondary{padding:.65rem 1rem;border-radius:1.5rem;font:600 14px system-ui;cursor:pointer}.primary{border:0;background:#4f46d8;color:white}.secondary{border:1px solid #bdc1c6;background:white;color:#444}.link{border:0;background:none;color:#4f46d8;font:600 14px system-ui;cursor:pointer;padding:.5rem 0}.status{min-height:1.4rem;margin-top:.8rem;color:#5f6368}.error{color:#b3261e}.view[hidden]{display:none}.recovery{font:13px/1.4 monospace;overflow-wrap:anywhere;background:#f1f3f4;padding:.8rem;border-radius:.5rem;user-select:all}
</style>
<main class="card">
  <section id="choose" class="view">
    <header><h1 id="title">Your accounts</h1><p id="subtitle">Accounts are stored securely in this browser.</p></header>
    <div class="content">
      <div id="capabilities" class="capabilities" hidden></div>
      <p id="requestText" hidden></p>
      <div id="accounts" class="accounts"></div>
      <button id="add" class="add"><span class="avatar">+</span><span><span class="name">Add account</span><span class="hint">Create or restore an account</span></span></button>
      <div class="actions"><button id="deny" class="secondary" hidden>Cancel</button></div>
      <p id="status" class="status"></p>
    </div>
  </section>

  <section id="addView" class="view" hidden>
    <header><h1>Add an account</h1><p>Create a new signing identity or restore one with a recovery key.</p></header>
    <div class="content">
      <label>Public display name<input id="accountName" maxlength="80" autocomplete="off" placeholder="Your name"></label>
      <button id="create" class="primary">Create account</button>
      <div><button id="showRestore" class="link">Use a recovery key instead</button></div>
      <div id="restoreFields" hidden>
        <label>Recovery key<textarea id="recoveryInput" autocomplete="off" spellcheck="false"></textarea></label>
        <button id="restore" class="primary">Continue</button>
      </div>
      <div class="actions"><button id="back" class="secondary">Back</button></div>
      <p id="addStatus" class="status"></p>
    </div>
  </section>

  <section id="recoveryView" class="view" hidden>
    <header><h1>Save your recovery key</h1><p>This is the only way to restore this account in another browser.</p></header>
    <div class="content">
      <div id="recoveryKey" class="recovery"></div>
      <div class="actions"><button id="copy" class="secondary">Copy</button><button id="saved" class="primary">I've saved it</button></div>
      <p id="recoveryStatus" class="status"></p>
    </div>
  </section>
</main>
<script type="module">
import { BoxOSClient } from "/client.js";
const boxos = new BoxOSClient();
const profileReducer = "5a9974345e9eb33a8f7055f040679a43cda5b35695e01d627bfdc584ffb9c765";
const identityProcedure = "3279ef4f756e0b669cd6a76d3c4aeb30649193c8001b6fe06bd13d1e398e6427";
const $ = id => document.querySelector(`#${id}`);
const encoder = new TextEncoder();
let accounts = await allAccounts();
let pending;
let createdAccount;
let createdName;
const completed = new Set();
await showChoose();

function showView(id) {
  for (const view of document.querySelectorAll(".view")) view.hidden = view.id !== id;
}
function database() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("boxos.accounts", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("accounts", { keyPath: "id" });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function allAccounts() {
  const db = await database();
  return await new Promise((resolve, reject) => {
    const request = db.transaction("accounts").objectStore("accounts").getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function saveAccount(account) {
  const db = await database();
  await new Promise((resolve, reject) => {
    const request = db.transaction("accounts", "readwrite").objectStore("accounts").put(account);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
  accounts = await allAccounts();
}
function setStatus(id, value, error = false) {
  const element = $(id); element.textContent = value; element.classList.toggle("error", error);
}
async function readProfile(account) {
  try { return (await boxos.publicState(profileReducer, `profile:${account.id}`)).value; }
  catch { return null; }
}
async function showChoose() {
  showView("choose");
  $("title").textContent = pending ? "Choose an account" : "Your accounts";
  $("subtitle").textContent = pending ? `${new URL(pending.origin).host} is requesting access` : "Private keys are stored securely in this browser.";
  $("deny").hidden = !pending;
  $("capabilities").hidden = !pending;
  $("requestText").hidden = !pending?.purpose;
  $("requestText").textContent = pending?.purpose || "";
  $("capabilities").textContent = "";
  if (pending) for (const capability of pending.capabilities) {
    const item = document.createElement("span"); item.textContent = capability; $("capabilities").append(item);
  }
  const profiles = await Promise.all(accounts.map(readProfile));
  const list = $("accounts"); list.textContent = "";
  accounts.forEach((account, index) => {
    const name = profiles[index]?.name || `${account.id.slice(0, 12)}…`;
    const button = document.createElement("button"); button.className = "account";
    const avatar = document.createElement("span"); avatar.className = "avatar"; avatar.textContent = name.trim()[0]?.toUpperCase() || "A";
    const label = document.createElement("span"); label.className = "name"; label.textContent = name;
    button.append(avatar, label); button.onclick = () => choose(account); list.append(button);
  });
  setStatus("status", accounts.length ? "" : "Add an account to continue.");
}
function bytesToBase64Url(value) {
  let text = "";
  for (const byte of new Uint8Array(value)) text += String.fromCharCode(byte);
  return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function base64UrlBytes(value) {
  const encoded = value.replace(/-/g, "+").replace(/_/g, "/");
  const binary = atob(encoded + "=".repeat((4 - encoded.length % 4) % 4));
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
  return bytes;
}
function canonical(value) {
  if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
  if (value && typeof value === "object") return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
  return JSON.stringify(value);
}
function normalizedCapabilities(value) {
  if (!Array.isArray(value) || value.length < 1 || value.length > 20
    || value.some(item => typeof item !== "string" || !item || item.length > 200)) throw new TypeError("Invalid capabilities");
  return [...new Set(value)].sort();
}
async function register(publicKey) {
  const receipt = await boxos.invoke(identityProcedure, { action: "register", publicKey });
  return receipt.ok;
}
async function importedPrivateKey(privateBytes) {
  return crypto.subtle.importKey("pkcs8", privateBytes, "Ed25519", false, ["sign"]);
}
async function signGrant(account, request) {
  const grant = {
    version: 2, domain: "boxos-capability", account: account.id,
    audience: request.origin, resource: request.resource, capabilities: request.capabilities,
    purpose: request.purpose, grantId: request.grantId,
  };
  const message = canonical(grant);
  const signature = bytesToBase64Url(await crypto.subtle.sign("Ed25519", account.privateKey, encoder.encode(message)));
  return { grant, message, signature, publicKey: account.publicKey };
}
async function writeProfile(account, name) {
  const authorization = await signGrant(account, {
    origin: location.origin, resource: profileReducer, capabilities: ["profile:write"],
    purpose: "Create your public profile", grantId: crypto.randomUUID(),
  });
  const existing = await readProfile(account);
  await boxos.invoke(profileReducer, { action: "set", name, bio: existing?.bio || "" }, { authorization });
}
async function choose(account) {
  if (!pending) {
    const profile = await readProfile(account);
    return setStatus("status", `${profile?.name || account.id.slice(0, 12) + "…"} is ready.`);
  }
  try {
    const authorization = await signGrant(account, pending);
    pending.source.postMessage({ boxos: "authorization", requestId: pending.requestId, ...authorization }, pending.origin);
    completed.add(pending.requestId); pending = undefined;
    setStatus("status", "Authorized. This window can be closed.");
    setTimeout(() => close(), 400);
  } catch (error) { setStatus("status", error.message, true); }
}
async function finishAccount(account, name) {
  await writeProfile(account, name);
  await saveAccount(account);
  createdAccount = undefined; createdName = undefined;
  await showChoose();
  if (pending) await choose(account);
}

$("add").onclick = () => { $("accountName").value = ""; $("recoveryInput").value = ""; $("restoreFields").hidden = true; $("showRestore").hidden = false; setStatus("addStatus", ""); showView("addView"); };
$("back").onclick = showChoose;
$("showRestore").onclick = () => { $("restoreFields").hidden = false; $("showRestore").hidden = true; };
$("create").onclick = async () => {
  try {
    const name = $("accountName").value.trim();
    if (!name) throw new Error("Enter a public display name");
    setStatus("addStatus", "Creating account…");
    const generated = await crypto.subtle.generateKey("Ed25519", true, ["sign", "verify"]);
    const publicKey = bytesToBase64Url(await crypto.subtle.exportKey("raw", generated.publicKey));
    const privateBytes = await crypto.subtle.exportKey("pkcs8", generated.privateKey);
    const privateKey = await importedPrivateKey(privateBytes);
    const id = await register(publicKey);
    createdAccount = { id, publicKey, privateKey };
    createdName = name;
    $("recoveryKey").textContent = `boxos1.${bytesToBase64Url(privateBytes)}.${publicKey}`;
    setStatus("recoveryStatus", ""); showView("recoveryView");
  } catch (error) { setStatus("addStatus", error.message, true); }
};
$("restore").onclick = async () => {
  try {
    setStatus("addStatus", "Restoring account…");
    const parts = $("recoveryInput").value.trim().split(".");
    if (parts.length !== 3 || parts[0] !== "boxos1") throw new Error("Invalid recovery key");
    const privateBytes = base64UrlBytes(parts[1]);
    const publicKey = parts[2];
    const privateKey = await importedPrivateKey(privateBytes);
    const publicCryptoKey = await crypto.subtle.importKey("raw", base64UrlBytes(publicKey), "Ed25519", false, ["verify"]);
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const signature = await crypto.subtle.sign("Ed25519", privateKey, challenge);
    if (!await crypto.subtle.verify("Ed25519", publicCryptoKey, signature, challenge)) throw new Error("Recovery key does not match");
    const id = await register(publicKey);
    const name = $("accountName").value.trim();
    if (!name) throw new Error("Enter a public display name");
    await finishAccount({ id, publicKey, privateKey }, name);
  } catch (error) { setStatus("addStatus", error.message, true); }
};
$("copy").onclick = async () => { await navigator.clipboard.writeText($("recoveryKey").textContent); setStatus("recoveryStatus", "Copied."); };
$("saved").onclick = () => finishAccount(createdAccount, createdName).catch(error => setStatus("recoveryStatus", error.message, true));
$("deny").onclick = () => {
  if (pending) {
    pending.source.postMessage({ boxos: "authorization-denied", requestId: pending.requestId }, pending.origin);
    completed.add(pending.requestId); pending = undefined;
  }
  close();
};
addEventListener("message", event => {
  const request = event.data;
  if (!request || request.boxos !== "authorize" || completed.has(request.requestId)
    || pending?.requestId === request.requestId
    || typeof request.requestId !== "string" || typeof request.grantId !== "string") return;
  try {
    if (!request.grantId || request.grantId.length > 200 || typeof request.purpose !== "string" || request.purpose.length > 500
      || typeof request.resource !== "string" || !/^[a-f0-9]{64}$/.test(request.resource)) throw new TypeError("Invalid authorization request");
    pending = {
      source: event.source, origin: event.origin, requestId: request.requestId,
      grantId: request.grantId, capabilities: normalizedCapabilities(request.capabilities),
      purpose: request.purpose, resource: request.resource,
    };
    showChoose();
  } catch (error) { setStatus("status", error.message, true); }
});
</script>
