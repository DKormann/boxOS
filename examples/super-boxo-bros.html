<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="description" content="SUPER BOXO BROS., a tiny three.js platform game hosted as an immutable BOXOS page.">
  <title>SUPER BOXO BROS. — a three.js platformer on BOXOS</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;touch-action:none;user-select:none;font-family:"Courier New",ui-monospace,monospace}#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:crisp-edges}#crt,#vig{position:fixed;inset:0;pointer-events:none;z-index:5}#crt{opacity:.55;background:repeating-linear-gradient(0deg,#0002 0,#0002 1px,transparent 1px,transparent 3px)}#vig{z-index:6;background:radial-gradient(transparent 55%,#0008 110%)}.px{color:#fff;text-shadow:2px 2px #0009;font-weight:800;letter-spacing:1px}#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:0;right:0;z-index:10;display:none;justify-content:space-around;font-size:clamp(10px,2.2vmin,18px);pointer-events:none}#hud div span{display:block;text-align:center}#overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;text-align:center;background:#0004}#logo{font-size:clamp(28px,8vmin,72px);color:#ffd800;line-height:1.05;text-shadow:3px 3px #b03000,6px 6px #0007}#sub{margin-top:12px;font-size:clamp(11px,2.4vmin,18px)}#msg{margin-top:28px;font-size:clamp(13px,3vmin,22px);animation:blink 1s steps(2) infinite}#keys{margin-top:22px;color:#cfe8ff;font-size:clamp(9px,2vmin,14px);line-height:1.8}@keyframes blink{50%{opacity:0}}#touch{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}.tbtn{position:absolute;bottom:max(4vmin,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;width:min(17vmin,92px);height:min(17vmin,92px);border:2px solid #fff7;border-radius:50%;background:#fff2;color:#fff;font:bold min(6vmin,34px) system-ui;pointer-events:auto;-webkit-tap-highlight-color:transparent}.tbtn.on{background:#fff6;transform:scale(.96)}#bl{left:4vmin}#br{left:23vmin}#bb{right:23vmin}#ba{right:4vmin}.brand{position:fixed;right:12px;bottom:8px;z-index:11;color:#fff9;font:700 10px system-ui;text-decoration:none;letter-spacing:.12em}@media(pointer:coarse),(max-width:760px){#touch{display:block}#keys{display:none}}
  </style>
</head>
<body>
  <canvas id="game" data-engine="three.js r160"></canvas>
  <div id="crt"></div><div id="vig"></div>
  <div id="hud" class="px">
    <div><span>BOXO</span><span id="hScore">000000</span></div><div><span>COINS</span><span id="hCoins">×00</span></div><div><span>WORLD</span><span>1-1</span></div><div><span>TIME</span><span id="hTime">300</span></div><div><span>LIVES</span><span id="hLives">×3</span></div>
  </div>
  <div id="overlay"><div id="logo" class="px">SUPER<br>BOXO BROS.</div><div id="sub" class="px">a 2D three.js platformer · immutable on boxos.org</div><div id="msg" class="px">PRESS ENTER OR TAP TO START</div><div id="keys" class="px">← → / A D — move &nbsp; SPACE / W — jump (hold = higher)<br>SHIFT — run &nbsp; X / K — fireball &nbsp; M — mute</div></div>
  <div id="touch"><div class="tbtn" id="bl">◀</div><div class="tbtn" id="br">▶</div><div class="tbtn" id="bb">B</div><div class="tbtn" id="ba">A</div></div>
  <a class="brand" href="/about">BOXOS</a>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const canvas=document.querySelector("#game"),overlay=document.querySelector("#overlay"),message=document.querySelector("#msg"),hud=document.querySelector("#hud");
const scoreEl=document.querySelector("#hScore"),coinsEl=document.querySelector("#hCoins"),timeEl=document.querySelector("#hTime"),livesEl=document.querySelector("#hLives");
const scene=new THREE.Scene();scene.background=new THREE.Color(0x65b9ff);scene.fog=new THREE.Fog(0x65b9ff,32,58);
const camera=new THREE.OrthographicCamera(-16,16,9,-9,.1,100);camera.position.set(0,5,24);camera.lookAt(0,5,0);
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
scene.add(new THREE.HemisphereLight(0xe8f7ff,0x6b5328,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-8,18,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const mats={ground:new THREE.MeshLambertMaterial({color:0xb65a24}),top:new THREE.MeshLambertMaterial({color:0x55ad36}),brick:new THREE.MeshLambertMaterial({color:0xc4612d}),question:new THREE.MeshLambertMaterial({color:0xffb51b}),pipe:new THREE.MeshLambertMaterial({color:0x20a83c}),player:new THREE.MeshLambertMaterial({color:0xf44322}),skin:new THREE.MeshLambertMaterial({color:0xffc48b}),enemy:new THREE.MeshLambertMaterial({color:0x8b4926}),coin:new THREE.MeshStandardMaterial({color:0xffd21c,metalness:.65,roughness:.28}),white:new THREE.MeshBasicMaterial({color:0xffffff}),black:new THREE.MeshBasicMaterial({color:0x191919}),fire:new THREE.MeshBasicMaterial({color:0xff8a00}),pole:new THREE.MeshLambertMaterial({color:0xe9eff2})};
const solids=[],coins=[],enemies=[],fireballs=[];let state="title",score=0,coinCount=0,lives=3,time=300,lastSecond=0,muted=false,accumulator=0,lastFrame=performance.now();
const keys={left:false,right:false,jump:false,run:false,fire:false};
function mesh(geometry,material,x,y,z=0){const m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function cube(x,y,w,h,material,solid=true,d=.9){const m=mesh(new THREE.BoxGeometry(w,h,d),material,x,y,0);if(solid)solids.push({x,y,w,h,mesh:m});return m}
function ground(x,w){cube(x,-1.25,w,2.5,mats.ground);cube(x,.08,w,.16,mats.top,false,.95)}
function cloud(x,y,s=1){const g=new THREE.Group();for(const [dx,dy,r] of [[0,0,1.1],[-.9,-.2,.75],[.9,-.25,.8],[0,-.55,1.25]]){const p=new THREE.Mesh(new THREE.SphereGeometry(r*s,10,7),mats.white);p.position.set(dx*s,dy*s,-5);g.add(p)}g.position.set(x,y,0);scene.add(g)}
function hill(x,w,h,color){const m=mesh(new THREE.ConeGeometry(w,h,4),new THREE.MeshLambertMaterial({color}),x,h/2-.15,-4);m.rotation.y=Math.PI/4;m.castShadow=false}
function block(x,y,type="brick"){const m=cube(x,y,1,1,mats[type]);if(type==="question"){const mark=document.createElement("canvas");mark.width=mark.height=64;const c=mark.getContext("2d");c.fillStyle="#ffb51b";c.fillRect(0,0,64,64);c.fillStyle="#fff";c.font="bold 48px monospace";c.textAlign="center";c.fillText("?",32,49);const tex=new THREE.CanvasTexture(mark);const face=new THREE.MeshBasicMaterial({map:tex});m.material=[mats.question,mats.question,mats.question,mats.question,face,face]}return m}
function addCoin(x,y){const m=mesh(new THREE.TorusGeometry(.3,.105,7,12),mats.coin,x,y,.1);m.rotation.y=.25;coins.push({x,y,mesh:m,taken:false})}
function addEnemy(x,y=.65){const body=mesh(new THREE.SphereGeometry(.48,10,7),mats.enemy,0,0,.05),foot=mesh(new THREE.BoxGeometry(.9,.22,.65),mats.black,0,-.38,.05),g=new THREE.Group();scene.remove(body,foot);g.add(body,foot);g.position.set(x,y,0);scene.add(g);enemies.push({spawn:x,x,y,vy:0,dir:-1,alive:true,mesh:g})}
function pipe(x,h){cube(x,h/2,1.7,h,mats.pipe);cube(x,h-.1,2.05,.5,mats.pipe)}
function scenery(){for(let x=6;x<170;x+=31)cloud(x,11+(x%3),.7+(x%5)/12);for(let x=3;x<180;x+=24)hill(x,5+(x%4),5+(x%3),x%2?0x63b54a:0x48a97a)}
function buildLevel(){scenery();ground(15,30);ground(43,20);ground(70,28);ground(105,36);ground(145,38);ground(174,18);for(const x of [8,9,10,14,15,16,26,27,40,41,52,53,54,72,73,88,89,90,111,112,134,135])block(x,4,x%3===0?"question":"brick");for(const x of [12,13,31,32,33,60,61,96,97,98,124,125])block(x,7,x%4===0?"question":"brick");pipe(20,2);pipe(47,3);pipe(78,2.5);pipe(118,3.5);pipe(156,2);for(const [x,y] of [[6,2],[9,5.2],[13,8.3],[24,2],[32,8.3],[39,2],[54,5.2],[63,2],[73,5.2],[84,2],[91,5.2],[98,8.3],[108,2],[120,5],[126,2],[136,5.2],[146,2],[157,3.3],[166,2]])addCoin(x,y);for(const x of [11,28,38,57,75,86,103,116,139,151,169])addEnemy(x);const pole=cube(178,5.5,.14,11,mats.pole,false,.2);pole.castShadow=false;const flag=mesh(new THREE.PlaneGeometry(2.5,1.5),new THREE.MeshBasicMaterial({color:0xff3048,side:THREE.DoubleSide}),176.7,9.5,.1);flag.geometry.translate(0,0,0)}
buildLevel();

const player=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(.82,1.05,.75),mats.player),head=new THREE.Mesh(new THREE.SphereGeometry(.43,10,7),mats.skin),cap=new THREE.Mesh(new THREE.BoxGeometry(.9,.22,.82),mats.player),eye=new THREE.Mesh(new THREE.BoxGeometry(.08,.1,.04),mats.black);body.position.y=-.2;head.position.y=.55;cap.position.y=.88;eye.position.set(.34,.58,.4);for(const m of [body,head,cap,eye]){m.castShadow=true;player.add(m)}scene.add(player);const p={x:2,y:1.05,vx:0,vy:0,w:.8,h:1.75,onGround:false,facing:1,fireReady:true};
function resetPlayer(){p.x=2;p.y=1.05;p.vx=p.vy=0;player.visible=true;player.position.set(p.x,p.y,0)}
function resetGame(){score=coinCount=0;time=300;lastSecond=performance.now();for(const c of coins){c.taken=false;c.mesh.visible=true}for(const e of enemies){e.x=e.spawn;e.y=.65;e.vy=0;e.dir=-1;e.alive=true;e.mesh.visible=true}for(const f of fireballs)scene.remove(f.mesh);fireballs.length=0;resetPlayer();updateHud()}
function updateHud(){scoreEl.textContent=String(score).padStart(6,"0");coinsEl.textContent="×"+String(coinCount).padStart(2,"0");timeEl.textContent=String(Math.max(0,Math.ceil(time)));livesEl.textContent="×"+lives}
function beep(freq=440,duration=.07,type="square"){if(muted)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;beep.ctx??=new C();const o=beep.ctx.createOscillator(),g=beep.ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,beep.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,beep.ctx.currentTime+duration);o.connect(g).connect(beep.ctx.destination);o.start();o.stop(beep.ctx.currentTime+duration)}
function start(){if(state==="playing")return;if(state==="gameover")lives=3;resetGame();state="playing";overlay.style.display="none";hud.style.display="flex";beep(523,.08);setTimeout(()=>beep(784,.1),90)}
function showEnd(text,win=false){state=win?"won":"gameover";message.textContent=text+" — TAP TO PLAY AGAIN";overlay.style.display="flex";hud.style.display="none";beep(win?880:120,.3,win?"square":"sawtooth")}
function loseLife(){if(state!=="playing")return;lives--;updateHud();if(lives<=0){showEnd("GAME OVER");return}state="paused";player.visible=false;beep(100,.25,"sawtooth");setTimeout(()=>{resetPlayer();state="playing"},650)}
function overlap(ax,ay,aw,ah,bx,by,bw,bh){return Math.abs(ax-bx)<(aw+bw)/2&&Math.abs(ay-by)<(ah+bh)/2}
function movePlayer(dt){const target=(keys.right?1:0)-(keys.left?1:0),speed=keys.run?9.5:6.2;p.vx+=((target*speed)-p.vx)*Math.min(1,dt*13);if(!target)p.vx*=Math.pow(.02,dt);if(keys.jump&&p.onGround){p.vy=11.5;p.onGround=false;beep(310,.08)}if(!keys.jump&&p.vy>4)p.vy=4;p.vy-=28*dt;
  p.x+=p.vx*dt;for(const s of solids)if(overlap(p.x,p.y,p.w,p.h,s.x,s.y,s.w,s.h)){if(p.vx>0)p.x=s.x-s.w/2-p.w/2;else if(p.vx<0)p.x=s.x+s.w/2+p.w/2;p.vx=0}
  const oldY=p.y;p.y+=p.vy*dt;p.onGround=false;for(const s of solids)if(overlap(p.x,p.y,p.w,p.h,s.x,s.y,s.w,s.h)){if(p.vy<=0&&oldY-p.h/2>=s.y+s.h/2-.12){p.y=s.y+s.h/2+p.h/2;p.vy=0;p.onGround=true}else if(p.vy>0){p.y=s.y-s.h/2-p.h/2;p.vy=-1;score+=10;beep(180,.05)}}
  if(target)p.facing=target;player.scale.x=p.facing;player.position.set(p.x,p.y,0);if(p.y<-6)loseLife();if(p.x>177){score+=Math.ceil(time)*10;updateHud();showEnd("COURSE CLEAR!",true)}
}
function updateItems(dt,t){for(const c of coins){if(c.taken)continue;c.mesh.rotation.y+=dt*5;c.mesh.position.y=c.y+Math.sin(t*.004+c.x)*.12;if(overlap(p.x,p.y,p.w,p.h,c.x,c.y,.7,.8)){c.taken=true;c.mesh.visible=false;coinCount++;score+=100;beep(900,.06);updateHud()}}
  for(const e of enemies){if(!e.alive)continue;e.vy-=25*dt;e.x+=e.dir*2.1*dt;e.y+=e.vy*dt;let supported=false;for(const s of solids)if(overlap(e.x,e.y,.9,.9,s.x,s.y,s.w,s.h)){if(e.vy<=0&&e.y>=s.y){e.y=s.y+s.h/2+.45;e.vy=0;supported=true}else{e.dir*=-1;e.x+=e.dir*.12}}if(!supported&&e.y<-5){e.alive=false;e.mesh.visible=false}e.mesh.position.set(e.x,e.y,0);if(overlap(p.x,p.y,p.w,p.h,e.x,e.y,.85,.8)){if(p.vy<0&&p.y>e.y+.45){e.alive=false;e.mesh.visible=false;p.vy=7;score+=200;beep(220,.08)}else loseLife()}}
}
function shoot(){if(!p.fireReady||state!=="playing")return;p.fireReady=false;setTimeout(()=>p.fireReady=true,280);const m=mesh(new THREE.SphereGeometry(.18,8,6),mats.fire,p.x+p.facing*.65,p.y,.2);fireballs.push({x:m.position.x,y:m.position.y,vx:p.facing*11,vy:2,life:2.2,mesh:m});beep(640,.05)}
function updateFire(dt){for(let i=fireballs.length-1;i>=0;i--){const f=fireballs[i];f.life-=dt;f.vy-=20*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;for(const s of solids)if(overlap(f.x,f.y,.35,.35,s.x,s.y,s.w,s.h)){if(f.vy<0){f.y=s.y+s.h/2+.2;f.vy=7}else f.life=0}for(const e of enemies)if(e.alive&&overlap(f.x,f.y,.35,.35,e.x,e.y,.85,.8)){e.alive=false;e.mesh.visible=false;f.life=0;score+=250;updateHud();beep(260,.06)}f.mesh.position.set(f.x,f.y,.2);f.mesh.rotation.z+=dt*14;if(f.life<=0){scene.remove(f.mesh);fireballs.splice(i,1)}}}
function step(dt,t){if(state!=="playing")return;movePlayer(dt);updateItems(dt,t);updateFire(dt);time-=dt;if(time<=0)loseLife();if(t-lastSecond>250){lastSecond=t;updateHud()}const target=Math.max(0,Math.min(163,p.x-5));camera.position.x+=(target-camera.position.x)*Math.min(1,dt*5);sun.position.x=camera.position.x-8}
function frame(t){const dt=Math.min(.05,(t-lastFrame)/1000);lastFrame=t;accumulator+=dt;while(accumulator>=1/120){step(1/120,t);accumulator-=1/120}renderer.render(scene,camera);requestAnimationFrame(frame)}
function resize(){const aspect=innerWidth/innerHeight,viewH=18;camera.top=viewH/2;camera.bottom=-viewH/2;camera.left=-viewH*aspect/2;camera.right=viewH*aspect/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}addEventListener("resize",resize);resize();resetPlayer();requestAnimationFrame(frame);
const map={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",Space:"jump",KeyW:"jump",ArrowUp:"jump",ShiftLeft:"run",ShiftRight:"run",KeyX:"fire",KeyK:"fire"};addEventListener("keydown",e=>{if(e.code==="Enter"&&state!=="playing")start();if(e.code==="KeyM"){muted=!muted;return}const k=map[e.code];if(k){e.preventDefault();keys[k]=true;if(k==="fire")shoot()}});addEventListener("keyup",e=>{const k=map[e.code];if(k){e.preventDefault();keys[k]=false}});overlay.addEventListener("pointerdown",start);
function touch(id,key,action){const el=document.querySelector(id);const down=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add("on");keys[key]=true;if(action)action()};const up=e=>{e.preventDefault();el.classList.remove("on");keys[key]=false};el.addEventListener("pointerdown",down);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up)}touch("#bl","left");touch("#br","right");touch("#ba","jump");touch("#bb","fire",shoot);
</script>
</body>
</html>
