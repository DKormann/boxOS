  <style>

}

}

.tabs { display: flex; gap: .3rem; border-bottom: 1px solid #dedfe5; margin-bottom: 1rem; }
.tab {

}
.tab.active { color: #5149d8; border-bottom-color: #5149d8; }

.list { display: grid; gap: .5rem; }
.person {
  display: flex; align-items: center; gap: .8rem; background: #fff;
  border: 1px solid #dedfe5; border-radius: .65rem; padding: .8rem 1rem;

.profile-page-link:hover { text-decoration: underline; }
.person-id { font-family: ui-monospace, monospace; font-size: .75rem; color: #999; }

button { padding: .55rem .9rem; border: 0; border-radius: .5rem; background: #5149d8; color: #fff; font: 600 14px system-ui; cursor: pointer; }
button:disabled { opacity: .5; }
button.secondary { background: #e9e8f3; color: #4a45a8; }
button.secondary.active { background: #5149d8; color: #fff; }
button.danger { background: #fdecea; color: #b3261e; }
.profile-actions input { padding: .55rem .7rem; border: 1px solid #c9cad1; border-radius: .5rem; font: inherit; min-width: 12rem; }

<main>

  <nav class="tabs">
    <button id="tab-following" type="button" class="tab active">Following</button>
    <button id="tab-followers" type="button" class="tab">Followers</button>

  <p id="empty" class="empty" hidden>Nothing here yet.</p>
  <p id="message" class="message"></p>
</main>
<script type="module">
// --- boxos-client.js ---

// Minimal browser client for BOXOS. No build step or dependencies required.
class BoxOSClient {
  constructor(baseUrl = globalThis.location?.origin, options = {}) {
    if (!baseUrl) throw new TypeError("A BOXOS base URL is required");
    this.baseUrl = baseUrl.replace(/\/$/, "");
    this.identity = options.identity || loadIdentity(options.storageKey || "boxos.identity");
  }

  async account() {
    return this.request("/account");
  }

  async balance() {
    return (await this.account()).balance;
  }

  stats() {
    return this.request("/stats", {}, false);
  }

  async authorize(capabilities, text = "", resource = "") {
    if (!Array.isArray(capabilities) || capabilities.some(value => typeof value !== "string")) {
      throw new TypeError("Capabilities must be an array of strings");
    }
    const expectedCapabilities = [...new Set(capabilities)].sort();
    const popup = globalThis.open(`${this.baseUrl}/examples/accounts`, "boxos-accounts", "popup,width=560,height=720");
    if (!popup) throw new BoxOSError("The account popup was blocked");
    const requestId = crypto.randomUUID();
    const nonce = crypto.randomUUID();
    const request = { boxos: "authorize", requestId, nonce, capabilities, text, resource };
    return await new Promise((resolve, reject) => {
      const send = setInterval(() => { if (!popup.closed) popup.postMessage(request, "*"); }, 300);
      const timeout = setTimeout(() => finish(new BoxOSError("Authorization timed out")), 5 * 60 * 1000);
      const receive = event => {
        if (event.source !== popup || event.data?.requestId !== requestId) return;
        if (event.data.boxos === "authorization-denied") return finish(new BoxOSError("Authorization denied"));
        if (event.data.boxos !== "authorization") return;
        const authorization = event.data;
        if (authorization.grant?.audience !== globalThis.location.origin || authorization.grant?.nonce !== nonce
          || authorization.grant?.text !== text || authorization.grant?.resource !== resource
          || JSON.stringify(authorization.grant?.capabilities) !== JSON.stringify(expectedCapabilities)) {
          return finish(new BoxOSError("Invalid authorization response"));
        }
        if (authorization.message !== canonicalJson(authorization.grant)) {
          return finish(new BoxOSError("Authorization message is not canonical"));
        }
        finish(undefined, authorization);
      };
      const finish = (error, value) => {
        clearInterval(send); clearTimeout(timeout); removeEventListener("message", receive); popup.close();
        if (error) reject(error); else resolve(value);
      };
      addEventListener("message", receive);
      popup.postMessage(request, "*");
    });
  }

  async verifyAuthorization(authorization, options = {}) {
    if (!authorization || authorization.message !== canonicalJson(authorization.grant)) {
      throw new TypeError("Invalid authorization");
    }
    const stats = await this.stats();
    return this.invoke(stats.identities.procedure, {
      action: "verify",
      account: authorization.grant.account,
      message: authorization.message,
      signature: authorization.signature,
    }, options);
  }

  async validateCode(kind, code, options = {}) {
    const stats = await this.stats();
    return this.invoke(stats.procedures.validate, { kind, code }, options);
  }

  async publishCode(kind, code, options = {}) {
    const stats = await this.stats();
    return this.invoke(stats.procedures.publish, { kind, code }, options);
  }

  registerReducer(code) {
    return this.register("reducers", code);
  }

  registerProcedure(code) {
    return this.register("procedures", code);
  }

  async register(kind, code) {
    if (typeof code !== "string") throw new TypeError("Code must be a string");
    return this.request(`/${kind}`, { method: "POST", body: JSON.stringify({ code }) });
  }

  inspect(hash) {
    return this.request(`/code/${encodeURIComponent(hash)}`, {}, false);
  }

  publicState(hash, key) {
    return this.request(`/state/${encodeURIComponent(hash)}/${encodeURIComponent(key)}`, {}, false);
  }

  pageInfo() {
    return this.request("/page", {}, false);
  }

  async publishPage(html, options = {}) {
    if (typeof html !== "string") throw new TypeError("Page must be a string");
    const info = await this.pageInfo();
    if (new TextEncoder().encode(html).byteLength > info.maximumBytes) throw new TypeError("Page is too large");
    const invocation = await this.invoke(info.reducer, html, options);
    return { hash: invocation.ok, url: info.urlTemplate.replace("{id}", invocation.ok), fuel: invocation.fuel };
  }

  invoke(hash, input = null, options = {}) {
    return this.request(`/invoke/${encodeURIComponent(hash)}`, {
      method: "POST",
      body: JSON.stringify({ input, fuel: options.fuel || 1000 }),
    });
  }

  async runReducer(code, input = null, options = {}) {
    const registered = await this.registerReducer(code);
    return this.invoke(registered.hash, input, options);
  }

  async runProcedure(code, input = null, options = {}) {
    const registered = await this.registerProcedure(code);
    return this.invoke(registered.hash, input, options);
  }

  async request(path, init = {}, authenticated = true) {
    const headers = new Headers(init.headers);
    if (init.body !== undefined) headers.set("content-type", "application/json");
    if (authenticated) headers.set("authorization", `Bearer ${this.identity}`);
    const response = await fetch(this.baseUrl + path, { ...init, headers });
    const result = await response.json();
    if (!response.ok) throw new BoxOSError(result.error || `HTTP ${response.status}`, response.status, result);
    return result;
  }
}

class BoxOSError extends Error {
  constructor(message, status, response) {
    super(message);
    this.name = "BoxOSError";
    this.status = status;
    this.response = response;
  }
}

function loadIdentity(storageKey) {
  try {
    const existing = globalThis.localStorage?.getItem(storageKey);
    if (existing) return existing;
    const identity = randomIdentity();
    globalThis.localStorage?.setItem(storageKey, identity);
    return identity;
  } catch {
    return randomIdentity();
  }
}

function canonicalJson(value) {
  if (Array.isArray(value)) return `[${value.map(canonicalJson).join(",")}]`;
  if (value && typeof value === "object") {
    return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonicalJson(value[key])}`).join(",")}}`;
  }
  return JSON.stringify(value);
}

function randomIdentity() {
  const bytes = crypto.getRandomValues(new Uint8Array(32));
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}


// --- boxos-reducer.js ---

// BOXOS friends reducer.
//
// Per-account social graph in PUBLIC state: following, followers, muted,
// blocked. Browsing is free via GET /state/<hash>/<key>. Writes go through the
// procedure, which verifies a reusable "manage friends" grant. The procedure
// also syncs the name to the profile reducer (canonical name store).
//
// Keys:
//   following:<account>  → [accountId, ...]
//   followers:<account>  → [accountId, ...]  (reverse index)
//   muted:<account>      → [accountId, ...]
//   blocked:<account>    → [accountId, ...]
//
// Block also mutually unfollows. Following a target that has blocked you is
// rejected.

const FRIENDS_REDUCER_CODE = `function getList(key) { return ctx.state.public.get(key) || []; }
function setList(key, list) { ctx.state.public.set(key, list); }
function contains(list, id) {
  for (let i = 0; i < list.length; i += 1) if (list[Number(i)] == id) return true;
  return false;
}
function addUnique(list, id) {
  if (contains(list, id)) return list;
  let next = [];
  for (let i = 0; i < list.length; i += 1) next[Number(next.length)] = list[Number(i)];
  next[Number(next.length)] = id;
  return next;
}
function drop(list, id) {
  let next = [];
  for (let i = 0; i < list.length; i += 1) if (list[Number(i)] != id) next[Number(next.length)] = list[Number(i)];
  return next;
}
function validAccount(value) { return typeof value == "string" && value.length == 64; }
if (input.action == "follow") {
  if (!validAccount(input.account) || !validAccount(input.target)) throw "Invalid follow";
  if (input.account == input.target) throw "Cannot follow yourself";
  if (contains(getList("blocked:" + input.target), input.account)) throw "Blocked by target";
  setList("following:" + input.account, addUnique(getList("following:" + input.account), input.target));
  setList("followers:" + input.target, addUnique(getList("followers:" + input.target), input.account));
  return true;
}
if (input.action == "unfollow") {
  if (!validAccount(input.account) || !validAccount(input.target)) throw "Invalid unfollow";
  setList("following:" + input.account, drop(getList("following:" + input.account), input.target));
  setList("followers:" + input.target, drop(getList("followers:" + input.target), input.account));
  return true;
}
if (input.action == "mute") {
  if (!validAccount(input.account) || !validAccount(input.target)) throw "Invalid mute";
  setList("muted:" + input.account, addUnique(getList("muted:" + input.account), input.target));
  return true;
}
if (input.action == "unmute") {
  if (!validAccount(input.account) || !validAccount(input.target)) throw "Invalid unmute";
  setList("muted:" + input.account, drop(getList("muted:" + input.account), input.target));
  return true;
}
if (input.action == "block") {
  if (!validAccount(input.account) || !validAccount(input.target)) throw "Invalid block";
  if (input.account == input.target) throw "Cannot block yourself";
  setList("blocked:" + input.account, addUnique(getList("blocked:" + input.account), input.target));
  setList("following:" + input.account, drop(getList("following:" + input.account), input.target));
  setList("followers:" + input.account, drop(getList("followers:" + input.account), input.target));
  setList("following:" + input.target, drop(getList("following:" + input.target), input.account));
  setList("followers:" + input.target, drop(getList("followers:" + input.target), input.account));
  return true;
}
if (input.action == "unblock") {
  if (!validAccount(input.account) || !validAccount(input.target)) throw "Invalid unblock";
  setList("blocked:" + input.account, drop(getList("blocked:" + input.account), input.target));
  return true;
}
throw "Unknown action";`;


// --- boxos-procedure.js ---

// BOXOS friends procedure.
// Verifies a reusable signed "manage friends" grant, applies the op to the
// friends reducer, and syncs grant.name to the profile reducer on every call.

function buildFriendsProcedureCode(reducerHash, identityReducerHash, profileReducerHash) {
  return `if (input.action != "mutate") throw "Unknown action";
if (typeof input.authorization != "object" || typeof input.authorization.message != "string" || typeof input.authorization.signature != "string") throw "Invalid authorization";
let grant = JSON.parse(input.authorization.message);
if (grant.version != 1 || grant.domain != "boxos-capability" || grant.resource != "${reducerHash}" || typeof grant.account != "string" || typeof grant.name != "string" || typeof grant.text != "string" || typeof grant.nonce != "string") throw "Invalid authorization";
let allowed = false;
for (let i = 0; i < grant.capabilities.length; i += 1) if (grant.capabilities[Number(i)] == "manage friends") allowed = true;
if (!allowed) throw "Missing manage friends capability";
function identity(tx) { return tx.invoke("${identityReducerHash}", { action: "lookup", account: grant.account }); }
let publicKey = await ctx.transaction(identity);
if (typeof publicKey != "string") throw "Unknown account";
let valid = await ctx.verify(publicKey, input.authorization.message, input.authorization.signature);
if (!valid) throw "Invalid signature";
let op = input.op;
function run(tx) {
  tx.invoke("${profileReducerHash}", { action: "setName", account: grant.account, name: grant.name });
  return tx.invoke("${reducerHash}", { action: op.type, account: grant.account, target: op.target, name: grant.name });
}
return await ctx.transaction(run);`;
}


// --- profile-reducer.js ---

// BOXOS profile reducer — the canonical name store.
//
// Every app writes the signed-in user's name here on sign-in (using their
// "set profile" capability grant), and reads everyone's name from here.
// One source of truth, no fallbacks.
//
// Key:
//   profile:<account> → string name

const PROFILE_REDUCER_CODE = `if (input.action != "setName") throw "Unknown action";
if (typeof input.account != "string" || typeof input.name != "string") throw "Invalid input";
if (input.name.length < 1 || input.name.length > 80) throw "Invalid name";
ctx.state.public.set("profile:" + input.account, input.name);
return input.name;`;


// --- app.js ---





const boxos = new BoxOSClient();
const $ = (id) => document.getElementById(id);
const sha256Hex = async (text) => {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
};

const CAPABILITY = "manage friends";
const GRANT_TEXT = "Manage your friends and blocks";
const PROFILE_URL = "https://pzzizqwdhoefinsp.pages.boxos.org/";
const AUTH_KEY = "friends.authorization";

let reducerHash = null;
let procedureHash = null;
let profileReducerHash = null;
let authorization = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
let myAccount = authorization?.grant?.account || null;
let myName = authorization?.grant?.name || null;
let following = new Set();
let muted = new Set();
let blocked = new Set();
let viewAccount = null; // account currently being viewed
let busy = false;

function setMessage(text, isError = false) {
  $("message").textContent = text;
  $("message").classList.toggle("error", isError);
}
const shortId = (id) => id ? id.slice(0, 8) + "…" : "";

async function ensureRegistered() {
  if (reducerHash && procedureHash) return;
  reducerHash = await sha256Hex(FRIENDS_REDUCER_CODE);
  profileReducerHash = await sha256Hex(PROFILE_REDUCER_CODE);
  const stats = await boxos.stats();
  const procCode = buildFriendsProcedureCode(reducerHash, stats.identities.reducer, profileReducerHash);
  procedureHash = await sha256Hex(procCode);
  await boxos.registerReducer(FRIENDS_REDUCER_CODE);
  await boxos.registerProcedure(procCode);
  await boxos.registerReducer(PROFILE_REDUCER_CODE);
}

// free public-state reads
async function readKey(key) {
  await ensureRegistered();
  const res = await fetch(`/state/${reducerHash}/${encodeURIComponent(key)}`);
  if (!res.ok) return null;
  const data = await res.json();
  return data.value;
}
const readList = (key) => readKey(key).then((v) => (Array.isArray(v) ? v : []));
async function readName(account) {
  if (!profileReducerHash) await ensureRegistered();
  const res = await fetch(`/state/${profileReducerHash}/profile:${encodeURIComponent(account)}`);
  if (!res.ok) return "";
  const v = (await res.json()).value;
  return typeof v === "string" ? v : "";
}

async function loadMySets() {
  if (!myAccount) { following = new Set(); muted = new Set(); blocked = new Set(); return; }
  const [f, m, b] = await Promise.all([
    readList("following:" + myAccount),
    readList("muted:" + myAccount),
    readList("blocked:" + myAccount),
  ]);
  following = new Set(f);
  muted = new Set(m);
  blocked = new Set(b);
}

async function mutate(op) {
  if (!authorization) throw new Error("Sign in first");
  await ensureRegistered();
  const receipt = await boxos.invoke(procedureHash, { action: "mutate", authorization, op }, { fuel: 1000 });
  return receipt.ok;
}

async function signIn() {
  try {
    setMessage("Choose an account in the popup…");
    await ensureRegistered();
    const auth = await boxos.authorize([CAPABILITY], GRANT_TEXT, reducerHash);
    authorization = auth;
    myAccount = auth.grant.account;
    myName = auth.grant.name;
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    setMessage("");
    updateAuthUi();
    await loadMySets();
    viewAccount = myAccount;
    await renderView();
  } catch (error) {
    setMessage(error.message || String(error), true);
  }
}

function signOut() {
  localStorage.removeItem(AUTH_KEY);
  authorization = null; myAccount = null; myName = null;
  following = new Set(); muted = new Set(); blocked = new Set();
  updateAuthUi();
  viewAccount = null;
  renderView();
}

// ----- navigation -----
function navigateTo(account) {
  const url = new URL(location.href);
  url.searchParams.set("u", account);
  history.pushState({}, "", url);
  viewAccount = account;
  renderView();
}
addEventListener("popstate", () => { initView(); renderView(); });

function initView() {
  const u = new URLSearchParams(location.search).get("u");
  viewAccount = (u && /^[a-f0-9]{64}$/.test(u)) ? u : myAccount;
}

// ----- rendering -----
async function renderView() {
  setMessage("");
  const isSelf = myAccount && viewAccount === myAccount;
  let profileName = "";
  if (viewAccount) profileName = await readName(viewAccount);
  renderProfile(profileName, isSelf);

  // tabs: profile always; following/followers for everyone; muted/blocked only for self
  const showPrivate = isSelf;
  $("tab-muted").hidden = !showPrivate;
  $("tab-blocked").hidden = !showPrivate;
  const tab = currentTab;
  if ((tab === "muted" || tab === "blocked") && !showPrivate) { setTab("following"); return; }
  await renderTab();
}

function renderProfile(name, isSelf) {
  const header = $("profile-header");
  header.textContent = "";
  if (!viewAccount) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "Sign in to see your profile, or paste an account ID below.";
    header.append(p);
    return;
  }
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = (name || "?").trim()[0]?.toUpperCase() || "?";
  const info = document.createElement("div");
  info.className = "profile-info";
  const nameEl = document.createElement("div");
  nameEl.className = "profile-name";
  nameEl.textContent = name || "(no name set)";
  const idEl = document.createElement("div");
  idEl.className = "profile-id";
  idEl.textContent = viewAccount;
  info.append(nameEl, idEl);
  header.append(avatar, info);

  const actions = document.createElement("div");
  actions.className = "profile-actions";
  if (isSelf) {
    const hint = document.createElement("span");
    hint.className = "muted";
    hint.textContent = "Name comes from your account manager.";
    actions.append(hint);
  } else if (myAccount) {
    actions.append(relationButton("follow", viewAccount, following.has(viewAccount), "Follow", "Following"));
    actions.append(relationButton("mute", viewAccount, muted.has(viewAccount), "Mute", "Muted"));
    actions.append(relationButton("block", viewAccount, blocked.has(viewAccount), "Block", "Blocked", true));
  }
  header.append(actions);

  // link to standalone profile page
  const profileLink = document.createElement("a");
  profileLink.className = "profile-page-link";
  profileLink.href = PROFILE_URL + "?u=" + encodeURIComponent(viewAccount);
  profileLink.textContent = "View on profile page →";
  header.append(profileLink);

  // share link
  const share = document.createElement("div");
  share.className = "share-row";
  const link = `${location.origin}${location.pathname}?u=${viewAccount}`;
  share.innerHTML = `<input class="url" readonly value="${link}"><button type="button" class="secondary" data-copy="${link}">Copy</button>`;
  header.append(share);
  share.querySelector("[data-copy]").onclick = async (e) => {
    try { await navigator.clipboard.writeText(e.target.dataset.copy); e.target.textContent = "Copied!"; setTimeout(() => e.target.textContent = "Copy", 1200); } catch {}
  };
}

function relationButton(type, target, active, inactiveLabel, activeLabel, danger) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "secondary" + (danger ? " danger" : "");
  btn.textContent = active ? activeLabel : inactiveLabel;
  if (active && type === "follow") btn.classList.add("active");
  btn.onclick = () => toggleRelation(type, target, active);
  return btn;
}

async function renderTab() {
  const grid = $("list");
  grid.textContent = "";
  $("empty").hidden = true;
  if (!viewAccount) return;
  let key;
  if (currentTab === "following") key = "following:" + viewAccount;
  else if (currentTab === "followers") key = "followers:" + viewAccount;
  else if (currentTab === "muted") key = "muted:" + viewAccount;
  else if (currentTab === "blocked") key = "blocked:" + viewAccount;
  else return;
  try {
    const ids = await readList(key);
    if (!ids.length) { $("empty").hidden = false; return; }
    const names = await Promise.all(ids.map((id) => readName(id)));
    for (let i = 0; i < ids.length; i += 1) grid.append(personRow(ids[Number(i)], names[Number(i)]));
  } catch (error) {
    setMessage(error.message || String(error), true);
  }
}

function personRow(id, name) {
  const row = document.createElement("article");
  row.className = "person";
  const avatar = document.createElement("div");
  avatar.className = "avatar sm";
  avatar.textContent = (name || "?").trim()[0]?.toUpperCase() || "?";
  const info = document.createElement("div");
  info.className = "person-info";
  const nm = document.createElement("a"); nm.className = "person-name"; nm.textContent = name || "(no name)"; nm.href = PROFILE_URL + "?u=" + encodeURIComponent(id);
  const iid = document.createElement("span"); iid.className = "person-id"; iid.textContent = shortId(id);
  info.append(nm, iid);
  const open = document.createElement("button");
  open.type = "button"; open.className = "secondary"; open.textContent = "View";
  open.onclick = () => navigateTo(id);
  row.append(avatar, info, open);
  return row;
}

// ----- actions -----
async function toggleRelation(type, target, active) {
  if (busy) return; busy = true;
  try {
    const action = active ? "un" + type : type;
    if (type === "block" && !active && !confirm("Block this person? They will be unfollowed and cannot follow you.")) { busy = false; return; }
    await mutate({ type: action, target });
    await loadMySets();
    await renderView();
  } catch (e) { setMessage(e.message, true); }
  finally { busy = false; }
}

function setTab(tab) {
  currentTab = tab;
  for (const t of ["following", "followers", "muted", "blocked"]) {
    $("tab-" + t).classList.toggle("active", t === tab);
  }
  renderTab();
}

function updateAuthUi() {
  const signedIn = Boolean(authorization);
  $("signed-out").hidden = signedIn;
  $("signed-in").hidden = !signedIn;
  $("account-name").textContent = myName || "";
}

// find-by-id form
$("find-form").addEventListener("submit", (e) => {
  e.preventDefault();
  let v = $("find-id").value.trim();
  const m = v.match(/[a-f0-9]{64}/i);
  if (!m) { setMessage("Paste a valid 64-character account ID or profile link.", true); return; }
  $("find-id").value = "";
  navigateTo(m[0].toLowerCase());
});

$("sign-in").addEventListener("click", signIn);
$("sign-out").addEventListener("click", signOut);
for (const t of ["following", "followers", "muted", "blocked"]) {
  $("tab-" + t).addEventListener("click", () => setTab(t));
}

let currentTab = "following";
updateAuthUi();
initView();
await loadMySets();
await renderView();

</script>
</body>
</html>
