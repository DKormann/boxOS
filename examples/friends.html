<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOXOS Friends</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#24252a;background:#f5f5f7}*{box-sizing:border-box}main{width:min(46rem,calc(100% - 2rem));margin:6vh auto}h1{font-size:2.5rem;margin:0}.muted,#message{color:#707078}.bar,.actions{display:flex;gap:.55rem;flex-wrap:wrap}input{flex:1;min-width:15rem;padding:.75rem;border:1px solid #ccc;border-radius:.5rem;font:inherit}button{padding:.7rem .9rem;border:0;border-radius:.5rem;background:#4f46d8;color:white;font-weight:600;cursor:pointer}.secondary{background:#e7e7ec;color:#333}.card{margin:1rem 0;padding:1rem;background:white;border:1px solid #ddd;border-radius:.75rem}.person{display:flex;align-items:center;gap:.7rem;padding:.65rem 0;border-bottom:1px solid #eee;flex-wrap:wrap}.person:last-child{border:0}.person a{flex:1;min-width:10rem;color:#333;text-decoration:none;font-weight:600}.person code{display:block;color:#888;font-size:.72rem;font-weight:400}.person-actions{display:flex;gap:.3rem}.person-actions button{padding:.35rem .5rem;font-size:.72rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}.grid .card{margin:0}h2{font-size:1.15rem}a{color:#4f46d8}[hidden]{display:none!important}
</style>
<main>
  <h1>Friends</h1>
  <p class="muted">Follow, mute, or block accounts. These lists have no wider effect yet.</p>
  <p><button id="sign-in">Choose account</button><span id="signed" hidden>Signed in as <strong id="account-name"></strong> · <a id="my-profile">My profile</a> · <button id="sign-out" class="secondary">Sign out</button></span></p>
  <form id="find" class="bar"><input id="find-account" placeholder="Account ID or profile link"><button>View account</button></form>
  <section id="view" class="card" hidden>
    <h2 id="view-name"></h2><code id="view-id"></code>
    <p><a id="view-profile">View profile</a></p>
    <div id="actions" class="actions" hidden>
      <button id="follow"></button><button id="mute" class="secondary"></button><button id="block" class="secondary"></button>
    </div>
  </section>
  <section id="lists" class="grid" hidden>
    <div class="card"><h2>Following</h2><div id="following"></div></div>
    <div class="card"><h2>Followers</h2><div id="followers"></div></div>
    <div class="card"><h2>Muted</h2><div id="muted"></div></div>
    <div class="card"><h2>Blocked</h2><div id="blocked"></div></div>
  </section>
  <p id="message"></p>
</main>
<script type="module">
import { BoxOSClient } from "/client.js";
const boxos = new BoxOSClient();
const friendsReducer = "4ac969e8aa8e49f91227c5dc30a3254345c8dfa5b7de57c58a8158f29567ec29";
const profileReducer = "28fde5f9ec74ba5c638bf5f51fa99c9d663b81e3a853594e8eb8a2f9a6c63964";
const storageKey = "friends.authorization";
let authorization;
try { authorization = JSON.parse(localStorage.getItem(storageKey) || "null"); }
catch { localStorage.removeItem(storageKey); }
let lists = { following: [], followers: [], muted: [], blocked: [] };
let viewedAccount = new URLSearchParams(location.search).get("account") || "";
const $ = id => document.getElementById(id);

function message(value) { $("message").textContent = value; }
function includes(items, account) { return items.includes(account); }
function listName(relation) {
  if (relation === "follow") return "following";
  if (relation === "mute") return "muted";
  return "blocked";
}
function profileLink(account) { return `/examples/profile?account=${encodeURIComponent(account)}`; }
async function profile(account) {
  try { return (await boxos.publicState(profileReducer, `profile:${account}`)).value; }
  catch { return null; }
}
async function invoke(input) {
  return (await boxos.invoke(friendsReducer, input, { authorization })).ok;
}
async function renderPeople(target, accounts) {
  const container = $(target); container.textContent = "";
  if (!accounts.length) { container.textContent = "None"; container.className = "muted"; return; }
  container.className = "";
  const profiles = await Promise.all(accounts.map(profile));
  accounts.forEach((account, index) => {
    const row = document.createElement("div"); row.className = "person";
    const link = document.createElement("a"); link.href = profileLink(account); link.textContent = profiles[index]?.name || "Unnamed account";
    const id = document.createElement("code"); id.textContent = account.slice(0, 12) + "…"; link.append(id);
    const actions = document.createElement("span"); actions.className = "person-actions";
    for (const relation of ["follow", "mute", "block"]) {
      const active = includes(lists[listName(relation)], account);
      const button = document.createElement("button"); button.className = "secondary";
      button.textContent = active ? `Un${relation}` : relation[0].toUpperCase() + relation.slice(1);
      button.onclick = () => change(relation, account);
      actions.append(button);
    }
    row.append(link, actions); container.append(row);
  });
}
async function renderLists() {
  $("lists").hidden = !authorization;
  if (!authorization) return;
  await Promise.all(Object.keys(lists).map(name => renderPeople(name, lists[name])));
}
async function renderViewed() {
  if (!/^[a-f0-9]{64}$/.test(viewedAccount)) { $("view").hidden = true; return; }
  const found = await profile(viewedAccount);
  $("view-name").textContent = found?.name || "Unnamed account"; $("view-id").textContent = viewedAccount;
  $("view-profile").href = profileLink(viewedAccount); $("view").hidden = false;
  const self = viewedAccount === authorization?.grant?.account;
  $("actions").hidden = !authorization || self;
  $("follow").textContent = includes(lists.following, viewedAccount) ? "Unfollow" : "Follow";
  $("mute").textContent = includes(lists.muted, viewedAccount) ? "Unmute" : "Mute";
  $("block").textContent = includes(lists.blocked, viewedAccount) ? "Unblock" : "Block";
}
async function refresh() {
  const signedIn = Boolean(authorization);
  $("sign-in").hidden = signedIn; $("signed").hidden = !signedIn;
  if (signedIn) {
    const ownProfile = await profile(authorization.grant.account);
    $("account-name").textContent = ownProfile?.name || authorization.grant.account.slice(0, 12) + "…";
    $("my-profile").href = profileLink(authorization.grant.account);
    try { lists = await invoke({ action: "list" }); }
    catch (error) {
      authorization = null; localStorage.removeItem(storageKey); message(error.message);
      return await refresh();
    }
  }
  await Promise.all([renderLists(), renderViewed()]);
}
async function change(relation, target = viewedAccount) {
  const enabled = !includes(lists[listName(relation)], target);
  try { lists = await invoke({ action: "change", relation, target, enabled }); await refresh(); }
  catch (error) { message(error.message); }
}
$("sign-in").onclick = async () => {
  try {
    authorization = await boxos.authorize(["friends:manage"], "Manage your follow, mute, and block lists", friendsReducer);
    localStorage.setItem(storageKey, JSON.stringify(authorization)); await refresh();
  } catch (error) { message(error.message); }
};
$("sign-out").onclick = async () => { authorization = null; localStorage.removeItem(storageKey); lists = { following: [], followers: [], muted: [], blocked: [] }; await refresh(); };
$("find").onsubmit = async event => {
  event.preventDefault(); const match = $("find-account").value.match(/[a-f0-9]{64}/);
  if (!match) return message("Enter a valid account ID or profile link.");
  viewedAccount = match[0]; history.replaceState(null, "", `?account=${viewedAccount}`); message(""); await renderViewed();
};
$("follow").onclick = () => change("follow");
$("mute").onclick = () => change("mute");
$("block").onclick = () => change("block");
await refresh();
</script>
