<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOXOS Accounts</title><link rel="stylesheet" href="/boxos.css"><script src="/client.js"></script>
<style>
body{display:grid;place-items:center;padding:1rem}.wallet{width:min(29rem,100%)}header{padding:2rem 2rem 1rem;text-align:center}header h1{font-size:1.55rem;margin:0 0 .4rem}.content{padding:1rem 1.25rem 1.5rem}.permission{margin:.75rem 0 1rem;padding:.8rem 1rem;border-radius:.7rem;background:var(--boxos-surface-raised);text-align:center}.accounts{display:grid;gap:.35rem}.account,.add{display:flex;width:100%;align-items:center;gap:.8rem;padding:.75rem;border:0;border-radius:.7rem;background:transparent;color:inherit;text-align:left;font-weight:400}.account:hover,.add:hover{background:var(--boxos-surface-raised)!important}.avatar{display:grid;place-items:center;width:2.6rem;height:2.6rem;flex:none;border-radius:50%;background:var(--boxos-accent);color:white;font-weight:700}.add .avatar{border:1px solid var(--boxos-line);background:var(--boxos-surface);color:var(--boxos-muted);font-size:1.4rem}.name{display:block;font-weight:650}.hint{display:block;color:var(--boxos-muted);font-size:.84rem}label{display:block;margin:.7rem 0;text-align:left}input,textarea{width:100%;margin:.35rem 0 .75rem}textarea{min-height:7rem;resize:vertical}.status{min-height:1.4rem;text-align:center}.recovery{padding:.9rem;border-radius:.6rem;background:var(--boxos-surface-raised);font:13px/1.45 ui-monospace,monospace;overflow-wrap:anywhere;user-select:all}.view[hidden]{display:none}
</style></head><body>
<a class="app-brand" href="/about">BOXOS</a>
<main class="wallet card">
<section id="choose" class="view"><header><h1 id="title">Your accounts</h1><p id="subtitle">Private keys are stored in this browser.</p></header><div class="content">
<div id="permission" class="permission" hidden><strong id="permissionName"></strong><span id="requester" class="hint"></span></div>
<div id="accounts" class="accounts"></div><button id="add" class="add"><span class="avatar">+</span><span><span class="name">Add account</span><span class="hint">Create or restore an account</span></span></button>
<div class="actions"><button id="cancel" class="secondary" hidden>Cancel</button></div><p id="status" class="status muted"></p></div></section>
<section id="addView" class="view" hidden><header><h1>Add an account</h1><p>Create a signing identity or restore one with a recovery key.</p></header><div class="content">
<label>Public username<input id="accountName" maxlength="32" autocomplete="off" pattern="[A-Za-z0-9_-]+" placeholder="username"></label>
<button id="create">Create account</button><div><button id="showRestore" class="link">Use a recovery key instead</button></div>
<div id="restoreFields" hidden><label>Recovery key<textarea id="recoveryInput" autocomplete="off" spellcheck="false"></textarea></label><button id="restore">Restore account</button></div>
<div class="actions"><button id="back" class="secondary">Back</button></div><p id="addStatus" class="status muted"></p></div></section>
<section id="recoveryView" class="view" hidden><header><h1>Save your recovery key</h1><p>This is the only way to restore this account in another browser or wallet version.</p></header><div class="content">
<div id="recoveryKey" class="recovery"></div><div class="actions"><button id="copy" class="secondary">Copy</button><button id="saved">I've saved it</button></div><p id="recoveryStatus" class="status muted"></p></div></section>
</main>
<script>
(async function(){
const $=id=>document.querySelector("#"+id),client=new BoxOSClient(),store="boxos:wallet:0.3.0";let records=JSON.parse(localStorage.getItem(store)||"[]"),created,request;
const examples=(await client.request("/examples")).examples,profile=examples.find(x=>x.name==="profile");if(!profile?.box)throw Error("Profile box is not published");
function view(id){document.querySelectorAll(".view").forEach(x=>x.hidden=x.id!==id)}function status(id,text,error=false){$(id).textContent=text;$(id).classList.toggle("error",error)}function requestedPermissions(){return [...(request?.permissions||[]),...(request?.sharedReads||[]).map(x=>x.label||"shared state read")]}
function b64(bytes){let s="";new Uint8Array(bytes).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}function unb64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");return Uint8Array.from(atob(s+"=".repeat((4-s.length%4)%4)),x=>x.charCodeAt(0))}
async function sign(record,message,operation="MESSAGE"){const key=await crypto.subtle.importKey("pkcs8",unb64(record.privateKey),"Ed25519",false,["sign"]),domain=operation==="MESSAGE"?"BOXOS:MESSAGE:0.3.0\0":"BOXOS:"+operation+":0.3.0\0",p=new TextEncoder().encode(domain),b=new TextEncoder().encode(JSON.stringify(message)),all=new Uint8Array(p.length+b.length);all.set(p);all.set(b,p.length);return b64(await crypto.subtle.sign("Ed25519",key,all))}
async function profileName(record){try{const x=await client.getPublicState(profile.box,record.publicKey);return x.found?x.value.username:null}catch{return null}}
async function render(){view("choose");$("title").textContent=request?"Choose an account":"Your accounts";$("subtitle").textContent=request?"An app is requesting permission":"Private keys are stored in this browser.";$("permission").hidden=!request;$("cancel").hidden=!request;if(request){$("permissionName").textContent=requestedPermissions().join(", ");$("requester").textContent=request.returnUrl}const names=await Promise.all(records.map(profileName));$("accounts").textContent="";records.forEach((r,i)=>{const name=names[i]||r.publicKey.slice(0,12)+"…",button=document.createElement("button");button.className="account";button.innerHTML='<span class="avatar"></span><span><span class="name"></span><span class="hint"></span></span>';button.querySelector(".avatar").textContent=name[0]?.toUpperCase()||"A";button.querySelector(".name").textContent=name;button.querySelector(".hint").textContent=r.publicKey;button.onclick=()=>choose(r);$("accounts").append(button)});status("status",records.length?"":"Add an account to continue.")}
async function publish(record,username){const app=await client.account(),grant={domain:"boxos-grant/0.3.0",account:record.publicKey,subject:app.publicKey,permission:"public-profile"};await client.invoke(profile.box,"set",{username,account:record.publicKey,grant,signature:await sign(record,grant)})}
async function finish(record,name){await publish(record,name);records.push(record);localStorage.setItem(store,JSON.stringify(records));created=null;await render();if(request)await choose(record)}
async function choose(record){if(!request)return status("status",(await profileName(record)||record.publicKey.slice(0,12)+"…")+" is ready.");const grants=[];for(const permission of request.permissions||[]){const grant={domain:"boxos-grant/0.3.0",account:record.publicKey,subject:request.subject,permission};grants.push({grant,signature:await sign(record,grant)})}const sharedReads=[];for(const item of request.sharedReads||[]){const metadata=await client.request("/boxes/"+encodeURIComponent(item.box)+"/state/shared/"+encodeURIComponent(item.key));if(!metadata.found||metadata.entry!==item.entry||metadata.authority!==record.publicKey)throw Error("Shared state request does not match this account");const grant={box:item.box,key:item.key,entry:item.entry,reader:request.subject};sharedReads.push({authority:record.publicKey,grant,signature:await sign(record,grant,"SHARED-READ")})}const result={state:request.state,account:record.publicKey,grants,sharedReads};location.href=request.returnUrl+"#boxos-grant="+encodeURIComponent(JSON.stringify(result))}
$("add").onclick=()=>{view("addView");$("accountName").value="";$("restoreFields").hidden=true;$("showRestore").hidden=false;status("addStatus","")};$("back").onclick=render;$("showRestore").onclick=()=>{$("restoreFields").hidden=false;$("showRestore").hidden=true};
$("create").onclick=async()=>{try{const name=$("accountName").value.trim();if(!/^[A-Za-z0-9_-]{1,32}$/.test(name))throw Error("Use 1–32 letters, numbers, _ or -");status("addStatus","Creating account…");const keys=await crypto.subtle.generateKey("Ed25519",true,["sign","verify"]),pub=(await crypto.subtle.exportKey("jwk",keys.publicKey)).x,pkcs8=await crypto.subtle.exportKey("pkcs8",keys.privateKey);await client.request("/accounts",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({publicKey:pub})});created={record:{publicKey:pub,privateKey:b64(pkcs8)},name};$("recoveryKey").textContent="boxos1."+b64(pkcs8)+"."+pub;view("recoveryView")}catch(e){status("addStatus",e.message,true)}};
$("restore").onclick=async()=>{try{const name=$("accountName").value.trim(),parts=$("recoveryInput").value.trim().split(".");if(!/^[A-Za-z0-9_-]{1,32}$/.test(name)||parts.length!==3||parts[0]!=="boxos1")throw Error("Enter a username and valid recovery key");const privateKey=await crypto.subtle.importKey("pkcs8",unb64(parts[1]),"Ed25519",false,["sign"]),publicKey=await crypto.subtle.importKey("raw",unb64(parts[2]),"Ed25519",false,["verify"]),challenge=crypto.getRandomValues(new Uint8Array(32)),sig=await crypto.subtle.sign("Ed25519",privateKey,challenge);if(!await crypto.subtle.verify("Ed25519",publicKey,sig,challenge))throw Error("Recovery key does not match");await client.request("/accounts",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({publicKey:parts[2]})});await finish({publicKey:parts[2],privateKey:parts[1]},name)}catch(e){status("addStatus",e.message,true)}};
$("copy").onclick=async()=>{await navigator.clipboard.writeText($("recoveryKey").textContent);status("recoveryStatus","Copied.")};$("saved").onclick=()=>finish(created.record,created.name).catch(e=>status("recoveryStatus",e.message,true));$("cancel").onclick=()=>history.back();
try{request=JSON.parse(new URLSearchParams(location.search).get("request")||"null")}catch{}if(request){const permissions=request.permissions||[],sharedReads=request.sharedReads||[];if(!Array.isArray(permissions)||!Array.isArray(sharedReads)||permissions.length+sharedReads.length<1||permissions.length>10||sharedReads.length>10||permissions.some(x=>typeof x!=="string"||x.length<1||x.length>100)||sharedReads.some(x=>!x||typeof x.box!=="string"||typeof x.key!=="string"||typeof x.entry!=="string"||(x.label!==undefined&&typeof x.label!=="string"))||typeof request.returnUrl!=="string"||typeof request.subject!=="string"||typeof request.state!=="string")request=null}await render();
})().catch(e=>{document.body.textContent=e.message});
</script></body></html>
