<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOXOS persistent counter</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #171725; }
  main { width: min(28rem, calc(100% - 3rem)); padding: 2.5rem; text-align: center; color: #202033; background: #fff; border-radius: 1.25rem; box-shadow: 0 1rem 4rem #0006; }
  output { display: block; min-height: 1.2em; margin: 1rem; font-size: 4rem; font-weight: 750; color: #5546d7; }
  button { padding: .8rem 1.3rem; border: 0; border-radius: .7rem; color: #fff; background: #5546d7; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; }
  small { display: block; margin-top: 1.5rem; color: #666; overflow-wrap: anywhere; }
</style>
<main>
  <h1>Persistent counter</h1>
  <p>This value is shared by every visitor and stored by a BOXOS reducer.</p>
  <output id="count">…</output>
  <button id="increment" type="button">Increment</button>
  <small>Reducer: 22b2e192642c1098fc5a59222ada9233decbe93294f91f6d068d6e63e63d63c0</small>
</main>
<script type="module">
  import { BoxOSClient } from "/client.js";

  const reducer = "22b2e192642c1098fc5a59222ada9233decbe93294f91f6d068d6e63e63d63c0";
  const boxos = new BoxOSClient();
  const count = document.querySelector("#count");
  const button = document.querySelector("#increment");

  async function read() {
    const response = await fetch(`/state/${reducer}/count`);
    count.value = response.ok ? (await response.json()).value : 0;
  }

  button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      const result = await boxos.invoke(reducer);
      count.value = result.ok;
    } catch (error) {
      count.value = "Error";
      console.error(error);
    } finally {
      button.disabled = false;
    }
  });

  await read();
</script>
