<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Group — a BOXOS group chat</title>
<style>
  :root{font:16px/1.5 system-ui,sans-serif;color:#1c1d22;--accent:#4f46d8}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f8}
  header{background:var(--accent);color:#fff;padding:1rem 1.2rem}
  header h1{margin:0;font-size:1.1rem;font-weight:650}
  header .sub{opacity:.85;font-size:.85rem}
  #feed{background:#fff;border:1px solid #e2e2ea;border-radius:.7rem;margin:1rem auto;width:min(46rem,calc(100% - 2rem));display:flex;flex-direction:column-reverse;min-height:60vh;max-height:70vh;overflow-y:auto}
  .msg{padding:.6rem 1rem;border-bottom:1px solid #f0f0f4}
  .msg .meta{display:flex;gap:.6rem;align-items:baseline;color:#707078;font-size:.8rem}
  .msg .name{color:var(--accent);font-weight:600;text-decoration:none}
  .msg .name:hover{text-decoration:underline}
  .msg .seq{font-variant-numeric:tabular-nums;opacity:.6}
  .msg .body{white-space:pre-wrap;word-break:break-word}
  .compose{width:min(46rem,calc(100% - 2rem));margin:0 auto 1.4rem;display:flex;gap:.5rem}
  .compose textarea{flex:1;resize:none;min-height:2.6rem;max-height:8rem;padding:.6rem .7rem;border:1px solid #cfcfd8;border-radius:.55rem;font:inherit}
  .compose button{border:0;background:var(--accent);color:#fff;border-radius:.55rem;padding:0 1.1rem;font:600 15px system-ui;cursor:pointer}
  .compose button:disabled{opacity:.5;cursor:not-allowed}
  .bar{width:min(46rem,calc(100% - 2rem));margin:0 auto .6rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
  .bar .status{color:#707078;font-size:.85rem}
  .bar button{border:1px solid #cfcfd8;background:#fff;color:#333;border-radius:1.4rem;padding:.4rem .9rem;font:600 13px system-ui;cursor:pointer}
  .err{color:#b3261e}
  a{color:var(--accent)}
  code{background:#eee;border-radius:.3rem;padding:.05rem .3rem}
</style>
</head>
<body>
<header>
  <h1>The Group</h1>
  <div class="sub">a single global group chat · last 100 messages · powered by <a href="https://boxos.org/docs" style="color:#fff">BOXOS</a></div>
</header>

<div class="bar">
  <span class="status" id="status">loading…</span>
  <button id="authBtn">Sign in to post</button>
</div>

<div id="feed"></div>

<div class="compose">
  <textarea id="text" placeholder="say something to everyone…" maxlength="1000" disabled></textarea>
  <button id="send" disabled>Post</button>
</div>

<script type="module">
import { BoxOSClient } from "/client.js";

const boxos = new BoxOSClient();            // baseUrl = this page origin
const ROOT = (await boxos.pageInfo()).rootUrl;
const REDUCER = "39001b03572373e9c96d4e27e04abeb8132005e7cf3ee9a38afa44699a6be9e7";
const PROFILE = "5a9974345e9eb33a8f7055f040679a43cda5b35695e01d627bfdc584ffb9c765";
const LIMIT = 100;
const STORAGE = "broadcast.authorization.v1";
const HAS_DATE = false;

const $ = id => document.getElementById(id);
const feed = $("feed");
const statusEl = $("status");
const textEl = $("text");
const sendBtn = $("send");
const authBtn = $("authBtn");

let authorization = null;
try { authorization = JSON.parse(localStorage.getItem(STORAGE) || "null"); } catch {}

const nameCache = new Map();
async function nameOf(account) {
  if (nameCache.has(account)) return nameCache.get(account);
  let name = account.slice(0, 10) + "…";
  try {
    const p = await boxos.publicState(PROFILE, "profile:" + account);
    if (p && p.value && p.value.name) name = p.value.name;
  } catch {}
  nameCache.set(account, name);
  return name;
}

function fmtTime(ms) {
  if (!ms) return "";
  try {
    const d = new Date(ms);
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch { return ""; }
}

function setStatus(s, err = false) {
  statusEl.textContent = s;
  statusEl.classList.toggle("err", err);
}

async function renderMessage(msg) {
  const wrap = document.createElement("div");
  wrap.className = "msg";
  const meta = document.createElement("div");
  meta.className = "meta";
  const name = document.createElement("a");
  name.className = "name";
  name.textContent = "…";
  name.href = `${ROOT}/examples/profile?account=${encodeURIComponent(msg.account)}`;
  name.title = "Open author profile";
  const seq = document.createElement("span");
  seq.className = "seq";
  seq.textContent = "#" + msg.seq;
  meta.append(name, seq);
  if (HAS_DATE && msg.time) {
    const t = document.createElement("span");
    t.textContent = fmtTime(msg.time);
    meta.append(t);
  }
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = msg.text;
  wrap.append(meta, body);
  name.textContent = await nameOf(msg.account);
  return wrap;
}

// Read last 100 messages via free public state reads.
async function refresh() {
  try {
    const headRes = await boxos.publicState(REDUCER, "head");
    const head = headRes.value || 0;
    const from = Math.max(1, head - LIMIT + 1);
    const keys = [];
    for (let s = head; s >= from; s--) keys.push("msg:" + s);
    const states = await Promise.all(keys.map(k =>
      boxos.publicState(REDUCER, k).then(r => r.value).catch(() => null)));
    feed.textContent = "";
    for (const m of states) if (m) feed.append(await renderMessage(m));
    if (head === 0) setStatus("no messages yet — be the first to post.");
    else setStatus(head + " messages total · showing latest " + states.filter(Boolean).length);
  } catch (e) {
    setStatus("read error: " + e.message, true);
  }
}

function setAuthState(signedIn) {
  textEl.disabled = !signedIn;
  sendBtn.disabled = !signedIn;
  authBtn.textContent = signedIn ? "Switch account / sign out" : "Sign in to post";
  if (signedIn) textEl.focus();
}

async function ensureAuth(force = false) {
  if (force) { authorization = null; localStorage.removeItem(STORAGE); }
  if (!authorization) {
    authorization = await boxos.authorize(
      ["manage:broadcast"],
      "Post messages to the global broadcast chat",
      REDUCER
    );
    localStorage.setItem(STORAGE, JSON.stringify(authorization));
  }
  setAuthState(true);
}

authBtn.onclick = async () => {
  if (authorization) {
    authorization = null;
    localStorage.removeItem(STORAGE);
    setAuthState(false);
    setStatus("Signed out.");
    return;
  }
  try {
    setStatus("opening account chooser…");
    await ensureAuth();
    setStatus("Signed in — you can post now.");
  } catch (e) {
    setStatus("sign-in failed: " + e.message, true);
  }
};

async function post() {
  const text = textEl.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  try {
    await ensureAuth();
    await boxos.invoke(REDUCER, { text }, { authorization });
    textEl.value = "";
    await refresh();
  } catch (e) {
    setStatus("post failed: " + e.message, true);
  } finally {
    sendBtn.disabled = false;
  }
}
sendBtn.onclick = post;
textEl.onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); post(); }
};

// Light polling: re-read head every 4s and refresh if it changed.
let lastHead = null;
async function poll() {
  try {
    const h = (await boxos.publicState(REDUCER, "head")).value || 0;
    if (lastHead !== null && h !== lastHead) await refresh();
    else lastHead = h;
  } catch {}
}
setInterval(poll, 4000);

setAuthState(Boolean(authorization));
await refresh();
lastHead = (await boxos.publicState(REDUCER, "head").then(r => r.value || 0).catch(() => 0));
</script>
</body>
</html>
