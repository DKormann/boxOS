<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The same BOXOS counter</title>
<style>
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; font-family: ui-monospace, monospace; color: #b8ffcf; background: #07120c; }
  main { width: min(34rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #2fc864; border-radius: .5rem; background: #0b1d12; }
  h1 { margin-top: 0; font-size: 1.3rem; }
  output { display: block; margin: 2rem 0; font-size: clamp(4rem, 20vw, 8rem); line-height: 1; text-align: center; }
  button { width: 100%; padding: 1rem; border: 1px solid #63ee91; color: inherit; background: #12351e; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; }
  p { color: #80bd94; }
</style>
<main>
  <h1>&gt; shared_counter</h1>
  <p>This is a different page using the same global reducer as the first counter demo.</p>
  <output id="count">…</output>
  <button id="increment">increment shared value</button>
</main>
<script type="module">
  import { BoxOSClient } from "/client.js";

  const reducer = "22b2e192642c1098fc5a59222ada9233decbe93294f91f6d068d6e63e63d63c0";
  const boxos = new BoxOSClient();
  const output = document.querySelector("#count");
  const button = document.querySelector("button");

  async function refresh() {
    try {
      output.value = (await boxos.publicState(reducer, "count")).value;
    } catch {
      output.value = 0;
    }
  }

  button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      output.value = (await boxos.invoke(reducer)).ok;
    } catch (error) {
      output.value = "error";
      console.error(error);
    } finally {
      button.disabled = false;
    }
  });

  await refresh();
</script>
