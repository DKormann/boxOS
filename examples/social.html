<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOXOS Social</title>
<link rel="stylesheet" href="/boxos.css"><script src="/client.js"></script>
<style>
body{max-width:68rem;margin:3rem auto;padding:0 1rem}header{text-align:center}.shell{display:grid;grid-template-columns:13rem 1fr;min-height:34rem;margin-top:2rem}.sidebar{padding:1rem;border-right:1px solid var(--boxos-line)}.sidebar button{display:block;width:100%;margin:.3rem 0;text-align:left}.content{padding:1.5rem}.view h2{margin-top:0}.row{display:flex;gap:.5rem;align-items:center;margin:.75rem 0}.row input{flex:1}.people,.conversations,.groups{display:grid;gap:.6rem}.person,.conversation,.group{padding:1rem;border:1px solid var(--boxos-line);border-radius:.7rem;background:var(--boxos-surface-raised);text-align:left}.person .actions,.conversation .actions,.group .actions{justify-content:flex-start}.messages{max-height:20rem;overflow:auto;padding:.75rem;border-radius:.6rem;background:var(--boxos-background)}.message{margin:.4rem 0;padding:.55rem .7rem;border-radius:.6rem;background:var(--boxos-surface-raised)}.message.mine{border-left:3px solid var(--boxos-accent)}.status{min-height:1.5rem;text-align:center}@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--boxos-line)}.sidebar button{width:auto;white-space:nowrap}}
</style></head><body>
<a class="app-brand" href="/about">BOXOS</a>
<header class="app-header"><h1>BOXOS Social</h1><p>Profiles, relationships, private conversations, and group chats in one box.</p><button id="login">Login</button><p id="identity"></p></header>
<main class="shell card"><nav class="sidebar"><button class="secondary tab" data-view="people">People</button><button class="secondary tab" data-view="messages">Messages</button><button class="secondary tab" data-view="groups">Groups</button><button class="secondary tab" data-view="settings">Privacy</button></nav>
<section class="content"><div id="people" class="view"><h2>People</h2><div class="row"><input id="personKey" placeholder="Public key"><button id="find">Add</button></div><div id="peopleList" class="people"></div></div>
<div id="messages" class="view" hidden><h2>Private messages</h2><div class="row"><input id="messageTarget" placeholder="Recipient public key"><input id="messageText" placeholder="Message"><button id="send">Send</button></div><div id="conversationList" class="conversations"></div></div>
<div id="groups" class="view" hidden><h2>Groups</h2><div class="row"><input id="groupName" placeholder="New group name"><button id="createGroup">Create</button></div><div id="groupList" class="groups"></div></div>
<div id="settings" class="view" hidden><h2>Privacy</h2><h3>Blocked</h3><div id="blocked"></div><h3>Muted</h3><div id="muted"></div></div><p id="status" class="status muted"></p></section></main>
<script>
(async function(){
const $=id=>document.querySelector("#"+id),client=new BoxOSClient(),examples=(await client.request("/examples")).examples,graph=examples.find(x=>x.name==="social-graph"),messagesBox=examples.find(x=>x.name==="social-messages"),groupsBox=examples.find(x=>x.name==="social-groups"),wallet=examples.find(x=>x.name==="wallet"),profile=examples.find(x=>x.name==="profile");if(!graph?.box||!messagesBox?.box||!groupsBox?.box||!wallet||!profile?.box)throw Error("Social examples are not published");
const app=await client.account(),grantKey="boxos:social:grant:0.3.0";let auth,state={following:[],blocked:[],muted:[],direct:[],groups:[]};try{auth=JSON.parse(localStorage.getItem(grantKey)||"null")}catch{}
const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.has("boxos-grant")){const returned=JSON.parse(fragment.get("boxos-grant"));if(returned.state!==sessionStorage.getItem("boxos:social:state"))throw Error("Wallet response state did not match");const socialGrant=returned.grants.find(x=>x.grant.permission==="social"),messagingGrant=returned.grants.find(x=>x.grant.permission==="messaging");if(!socialGrant||!messagingGrant)throw Error("Wallet did not return social permissions");auth={account:returned.account,social:socialGrant,messaging:messagingGrant};localStorage.setItem(grantKey,JSON.stringify(auth));history.replaceState(null,"",location.pathname)}
function message(text,error=false){$("status").textContent=text;$("status").classList.toggle("error",error)}async function name(key){try{const x=await client.getPublicState(profile.box,key);return x.found?x.value.username:key.slice(0,12)+"…"}catch{return key.slice(0,12)+"…"}}
function login(){const nonce=crypto.randomUUID();sessionStorage.setItem("boxos:social:state",nonce);const request={permissions:["social","messaging"],subject:app.publicKey,state:nonce,returnUrl:location.origin+location.pathname};location.href=wallet.localUrl+"/?request="+encodeURIComponent(JSON.stringify(request))}
async function invoke(box,signed,action,extra={}){return(await client.invoke(box,"manage",{action,account:auth.account,grant:signed.grant,signature:signed.signature,...extra})).result}
async function refresh(){const results=await Promise.all([invoke(graph.box,auth.social,"view"),invoke(messagesBox.box,auth.messaging,"view"),invoke(groupsBox.box,auth.messaging,"view")]);state={...results[0],direct:results[1],groups:results[2]}}
async function manage(action,extra={}){if(!auth)return login();message("Working…");try{let box=graph.box,signed=auth.social,remote=action;if(action==="send"){box=messagesBox.box;signed=auth.messaging}else if(action==="create_group"){box=groupsBox.box;signed=auth.messaging;remote="create"}else if(action==="invite"||action==="group_send"){box=groupsBox.box;signed=auth.messaging;remote=action==="group_send"?"send":action}await invoke(box,signed,remote,extra);await refresh();message("");await render()}catch(e){message(e.message,true)}}
function action(text,run,secondary=false){const button=document.createElement("button");button.textContent=text;if(secondary)button.className="secondary";button.onclick=run;return button}
async function personCard(key){const box=document.createElement("article");box.className="person";const title=document.createElement("strong"),hint=document.createElement("span"),actions=document.createElement("div");title.textContent=await name(key);hint.className="hint muted";hint.textContent=" — "+key;actions.className="actions";const following=state.following.includes(key),blocked=state.blocked.includes(key),muted=state.muted.includes(key);actions.append(action(following?"Unfollow":"Follow",()=>manage(following?"unfollow":"follow",{target:key})),action(blocked?"Unblock":"Block",()=>manage(blocked?"unblock":"block",{target:key}),true),action(muted?"Unmute":"Mute",()=>manage(muted?"unmute":"mute",{target:key}),true));box.append(title,hint,actions);return box}
async function render(){if(!auth){$("login").textContent="Login";$("identity").textContent="Login to use social features.";return}$("login").textContent="Switch account";$("identity").textContent="Logged in as "+await name(auth.account);const known=[...new Set([...state.following,...state.blocked,...state.muted,...state.direct.map(x=>x.account)])];$("peopleList").textContent="";for(const key of known)$("peopleList").append(await personCard(key));if(!known.length)$("peopleList").textContent="Add a public key to get started.";$("blocked").textContent=await Promise.all(state.blocked.map(name)).then(x=>x.join(", "))||"None";$("muted").textContent=await Promise.all(state.muted.map(name)).then(x=>x.join(", "))||"None";$("conversationList").textContent="";for(const conversation of state.direct){const box=document.createElement("article");box.className="conversation";const title=document.createElement("h3");title.textContent=await name(conversation.account);const messages=document.createElement("div");messages.className="messages";conversation.messages.filter(x=>!state.muted.includes(x.from)).forEach(item=>{const line=document.createElement("div");line.className="message"+(item.from===auth.account?" mine":"");line.textContent=item.text;messages.append(line)});box.append(title,messages);$("conversationList").append(box)}if(!state.direct.length)$("conversationList").textContent="No conversations yet.";$("groupList").textContent="";for(const group of state.groups){const box=document.createElement("article");box.className="group";const title=document.createElement("h3"),members=document.createElement("p"),messages=document.createElement("div"),controls=document.createElement("div"),text=document.createElement("input"),send=action("Send",()=>manage("group_send",{group:group.id,text:text.value,id:crypto.randomUUID()}));title.textContent=group.name;members.textContent=group.members.length+" members";messages.className="messages";group.messages.filter(x=>!state.muted.includes(x.from)).forEach(item=>{const line=document.createElement("div");line.className="message"+(item.from===auth.account?" mine":"");line.textContent=item.text;messages.append(line)});controls.className="row";text.placeholder="Group message";controls.append(text,send);if(group.owner===auth.account){const invite=document.createElement("input"),button=action("Invite",()=>manage("invite",{group:group.id,target:invite.value}),true);invite.placeholder="Public key to invite";const inviteRow=document.createElement("div");inviteRow.className="row";inviteRow.append(invite,button);box.append(title,members,messages,controls,inviteRow)}else box.append(title,members,messages,controls);$("groupList").append(box)}if(!state.groups.length)$("groupList").textContent="No groups yet."}
$("login").onclick=login;document.querySelectorAll(".tab").forEach(button=>button.onclick=()=>document.querySelectorAll(".view").forEach(view=>view.hidden=view.id!==button.dataset.view));$("find").onclick=async()=>{const key=$("personKey").value.trim();if(key&&auth){const card=await personCard(key);$("peopleList").prepend(card)}};$("send").onclick=()=>manage("send",{target:$("messageTarget").value.trim(),text:$("messageText").value,id:crypto.randomUUID()});$("createGroup").onclick=()=>manage("create_group",{group:crypto.randomUUID(),name:$("groupName").value});if(auth){await refresh();await render()}else await render();
})().catch(e=>{document.querySelector("#status").textContent=e.message});
</script></body></html>
