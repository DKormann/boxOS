<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOXOS Chat</title>
<link rel="stylesheet" href="/boxos.css"><script src="/client.js"></script>
<style>
body{display:grid;min-height:100vh;place-items:center;padding:1rem}.app{display:grid;width:min(72rem,100%);height:min(48rem,calc(100vh - 2rem));grid-template-columns:20rem minmax(0,1fr)}.rail{display:flex;min-height:0;flex-direction:column;border-right:1px solid var(--boxos-line);background:var(--boxos-surface)}.rail-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;padding:.8rem;border-bottom:1px solid var(--boxos-line)}.account{display:flex;min-width:0;align-items:center;gap:.65rem;padding:.45rem;border:0;color:var(--boxos-text);background:transparent;text-align:left;font-weight:400}.account:hover{background:var(--boxos-surface-raised)!important}.avatar{display:grid;width:2.5rem;height:2.5rem;flex:none;place-items:center;border-radius:50%;color:#fff;background:var(--boxos-accent);font-weight:750}.account-copy{min-width:0}.account-name,.account-key{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account-name{font-weight:700}.account-key{color:var(--boxos-muted);font-size:.76rem}.new-button{width:2.6rem;height:2.6rem;padding:0;border-radius:50%;font-size:1.4rem}.history{min-height:0;overflow-y:auto}.chat-item{display:grid;width:100%;grid-template-columns:2.6rem minmax(0,1fr);gap:.7rem;padding:.85rem 1rem;border:0;border-bottom:1px solid var(--boxos-line);border-radius:0;color:var(--boxos-text);background:transparent;text-align:left;font-weight:400}.chat-item:hover,.chat-item.active{background:var(--boxos-surface-raised)!important}.chat-copy{min-width:0}.chat-title,.chat-preview{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-title{font-weight:700}.chat-preview{color:var(--boxos-muted);font-size:.84rem}.pane{display:flex;min-width:0;min-height:0;flex-direction:column;background:var(--boxos-background)}.pane-header{padding:1rem 1.25rem;border-bottom:1px solid var(--boxos-line);background:var(--boxos-surface)}.pane-header h2,.pane-header p{margin:0}.messages{display:flex;min-height:0;flex:1;flex-direction:column;gap:.45rem;overflow-y:auto;padding:1.25rem}.message{align-self:flex-start;max-width:min(80%,34rem);padding:.6rem .8rem;border-radius:.8rem .8rem .8rem .2rem;background:var(--boxos-surface-raised);overflow-wrap:anywhere}.message.mine{align-self:flex-end;border-radius:.8rem .8rem .2rem .8rem;color:var(--boxos-on-accent);background:var(--boxos-accent)}.sender{display:block;margin-bottom:.15rem;color:var(--boxos-muted);font-size:.72rem;font-weight:700}.message.mine .sender{color:#ffffffbb}.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.55rem;padding:.85rem 1rem;border-top:1px solid var(--boxos-line);background:var(--boxos-surface)}.empty{display:grid;flex:1;place-items:center;padding:2rem;color:var(--boxos-muted);text-align:center}.settings{overflow-y:auto;padding:1.5rem}.settings-inner{max-width:34rem}.settings h2{margin-top:0}.settings-card{margin:1rem 0;padding:1rem;border:1px solid var(--boxos-line);border-radius:.7rem;background:var(--boxos-surface)}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--boxos-line)}.settings-row:last-child{border-bottom:0}.settings-row code{min-width:0;overflow:hidden;text-overflow:ellipsis}.status{min-height:1.4rem;color:var(--boxos-muted)}dialog{width:min(28rem,calc(100% - 2rem));padding:0;border:1px solid var(--boxos-line);border-radius:1rem;color:var(--boxos-text);background:var(--boxos-surface);box-shadow:0 1rem 4rem #0008}dialog::backdrop{background:#0009}.dialog-content{padding:1.25rem}.dialog-content h2{margin-top:0}.dialog-content label{display:block;margin:.8rem 0}.dialog-content input{width:100%;margin-top:.35rem}.dialog-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}@media(max-width:680px){body{padding:0}.app{width:100%;height:100vh;grid-template-columns:8.5rem minmax(0,1fr);border:0;border-radius:0}.rail-top{grid-template-columns:1fr}.account{padding:.25rem}.account-copy{display:none}.new-button{width:100%;border-radius:.55rem}.chat-item{grid-template-columns:1fr;padding:.75rem}.chat-item .avatar{display:none}.chat-preview{font-size:.72rem}.pane-header{cursor:pointer}.pane-header:before{content:"‹ Chats";display:block;margin-bottom:.3rem;color:var(--boxos-accent);font-size:.78rem}}
</style></head><body>
<main class="app card"><aside class="rail"><div class="rail-top"><button id="account" class="account"><span id="accountAvatar" class="avatar">?</span><span class="account-copy"><span id="accountName" class="account-name">Account</span><span id="accountKey" class="account-key"></span></span></button><button id="newChat" class="new-button" aria-label="New chat">+</button></div><div id="history" class="history"></div></aside><section id="pane" class="pane"></section></main>
<dialog id="newDialog"><div class="dialog-content"><h2>New chat</h2><label>Account public key<input id="newAccount" placeholder="Public key"></label><button id="openDirect">Open chat</button><hr><label>Group name<input id="newGroup" maxlength="80" placeholder="Group name"></label><button id="createGroup">Create group</button><div class="dialog-actions"><button id="closeDialog" class="secondary">Cancel</button></div></div></dialog>
<script>
(async function(){
const $=id=>document.querySelector("#"+id),client=new BoxOSClient(),examples=(await client.request("/examples")).examples,messagesBox=examples.find(x=>x.name==="social-messages"),groupsBox=examples.find(x=>x.name==="social-groups"),graph=examples.find(x=>x.name==="social-graph"),wallet=examples.find(x=>x.name==="wallet"),profile=examples.find(x=>x.name==="profile");if(!messagesBox?.box||!groupsBox?.box||!graph?.box||!wallet?.currentUrl||!profile?.box)throw Error("Chat examples are not published");
const app=await client.account(),grantKey="boxos:social:grant:0.3.0",params=new URLSearchParams(location.search),requestedAccount=params.get("to")||params.get("person");let auth,activeChat=/^[A-Za-z0-9_-]{43}$/.test(requestedAccount||"")?"direct:"+requestedAccount:undefined,settingsOpen=false,state={following:[],blocked:[],muted:[],direct:[],groups:[]};try{auth=JSON.parse(localStorage.getItem(grantKey)||"null")}catch{}
function login(){const nonce=crypto.randomUUID();sessionStorage.setItem("boxos:social:state",nonce);const request={permissions:["social","messaging","public-profile"],subject:app.publicKey,state:nonce,returnUrl:location.origin+location.pathname+location.search};location.href=wallet.currentUrl+"/?request="+encodeURIComponent(JSON.stringify(request))}
const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.has("boxos-grant")){const returned=JSON.parse(fragment.get("boxos-grant"));if(returned.state!==sessionStorage.getItem("boxos:social:state"))throw Error("Wallet response state did not match");if(returned.grants?.length){const social=returned.grants.find(x=>x.grant.permission==="social"),messaging=returned.grants.find(x=>x.grant.permission==="messaging"),profileGrant=returned.grants.find(x=>x.grant.permission==="public-profile");if(!social||!messaging||!profileGrant)throw Error("Wallet did not return the requested permissions");auth={account:returned.account,social,messaging,profile:profileGrant}}if(returned.sharedReads?.length){if(!auth||returned.account!==auth.account)throw Error("Shared read grants belong to another account");const messageRead=returned.sharedReads.find(x=>x.grant.box===messagesBox.box),groupRead=returned.sharedReads.find(x=>x.grant.box===groupsBox.box);if(!messageRead||!groupRead)throw Error("Wallet did not return the requested chat reads");auth.reads={messages:messageRead,groups:groupRead}}localStorage.setItem(grantKey,JSON.stringify(auth));history.replaceState(null,"",location.pathname+location.search)}
if(!auth||!auth.profile){login();return}
async function name(key){try{const value=await client.getPublicState(profile.box,key);return value.found&&value.value.username?value.value.username:key.slice(0,12)+"…"}catch{return key.slice(0,12)+"…"}}
async function invoke(box,signed,action,extra={}){return(await client.invoke(box,"manage",{action,account:auth.account,grant:signed.grant,signature:signed.signature,...extra})).result}
const messageKey="messages:"+auth.account,groupKey="groups:"+auth.account;
async function sharedMetadata(box,key){return client.request("/boxes/"+encodeURIComponent(box)+"/state/shared/"+encodeURIComponent(key))}
function validRead(read,box,key,entry){return read&&read.authority===auth.account&&read.grant?.box===box&&read.grant?.key===key&&read.grant?.entry===entry&&read.grant?.reader===app.publicKey&&typeof read.signature==="string"}
async function ensureSharedReads(){let metadata=await Promise.all([sharedMetadata(messagesBox.box,messageKey),sharedMetadata(groupsBox.box,groupKey)]);if(!metadata[0].found||!metadata[1].found){await Promise.all([invoke(messagesBox.box,auth.messaging,"view"),invoke(groupsBox.box,auth.messaging,"view")]);metadata=await Promise.all([sharedMetadata(messagesBox.box,messageKey),sharedMetadata(groupsBox.box,groupKey)])}if(validRead(auth.reads?.messages,messagesBox.box,messageKey,metadata[0].entry)&&validRead(auth.reads?.groups,groupsBox.box,groupKey,metadata[1].entry))return;const nonce=crypto.randomUUID();sessionStorage.setItem("boxos:social:state",nonce);const request={permissions:[],sharedReads:[{box:messagesBox.box,key:messageKey,entry:metadata[0].entry,label:"read direct messages"},{box:groupsBox.box,key:groupKey,entry:metadata[1].entry,label:"read group chats"}],subject:app.publicKey,state:nonce,returnUrl:location.origin+location.pathname+location.search};location.href=wallet.currentUrl+"/?request="+encodeURIComponent(JSON.stringify(request));await new Promise(()=>{})}
async function readChats(){const result=await Promise.all([client.readShared(messagesBox.box,messageKey,auth.reads.messages.authority,auth.reads.messages.grant,auth.reads.messages.signature),client.readShared(groupsBox.box,groupKey,auth.reads.groups.authority,auth.reads.groups.grant,auth.reads.groups.signature)]);state.direct=result[0].value;state.groups=result[1].value}
async function refresh(){const graphState=await invoke(graph.box,auth.social,"view");state={...state,...graphState};await readChats()}
async function manage(action,extra={}){let box=graph.box,signed=auth.social,remote=action;if(action==="send"){box=messagesBox.box;signed=auth.messaging}else if(action==="create_group"){box=groupsBox.box;signed=auth.messaging;remote="create"}else if(action==="invite"||action==="group_send"){box=groupsBox.box;signed=auth.messaging;remote=action==="group_send"?"send":action}await invoke(box,signed,remote,extra);await refresh();await render()}
function latest(messages){return messages.length?messages[messages.length-1]:null}function latestTime(messages){const item=latest(messages);return item&&typeof item.sentAt==="number"?item.sentAt:0}
function chats(){const items=state.direct.map(item=>({id:"direct:"+item.account,type:"direct",account:item.account,messages:item.messages.filter(message=>!state.muted.includes(message.from))}));state.groups.forEach(group=>items.push({id:"group:"+group.id,type:"group",group,messages:group.messages.filter(message=>!state.muted.includes(message.from))}));if(activeChat?.startsWith("direct:")&&!items.some(item=>item.id===activeChat))items.push({id:activeChat,type:"direct",account:activeChat.slice(7),messages:[]});return items.sort((a,b)=>latestTime(b.messages)-latestTime(a.messages))}
async function renderHistory(){const items=chats(),history=$("history");if(!activeChat&&items.length)activeChat=items[0].id;history.textContent="";for(const item of items){const title=item.type==="group"?item.group.name:await name(item.account),last=latest(item.messages),button=document.createElement("button"),avatar=document.createElement("span"),copy=document.createElement("span"),heading=document.createElement("span"),preview=document.createElement("span");button.className="chat-item"+(item.id===activeChat&&!settingsOpen?" active":"");avatar.className="avatar";avatar.textContent=item.type==="group"?"#":title[0]?.toUpperCase()||"?";copy.className="chat-copy";heading.className="chat-title";heading.textContent=title;preview.className="chat-preview";preview.textContent=last?last.text:item.type==="group"?item.group.members.length+" members":"No messages yet";copy.append(heading,preview);button.append(avatar,copy);button.onclick=async()=>{settingsOpen=false;activeChat=item.id;await render()};history.append(button)}if(!items.length)history.innerHTML='<div class="empty">Start a chat with +</div>'}
async function renderChat(item){const pane=$("pane");pane.textContent="";if(!item){pane.innerHTML='<div class="empty">Select a chat or use + to start one.</div>';return}const title=item.type==="group"?item.group.name:await name(item.account),header=document.createElement("header"),heading=document.createElement("h2"),detail=document.createElement("p");header.className="pane-header";heading.textContent=title;detail.textContent=item.type==="group"?item.group.members.length+" members":item.account;header.append(heading,detail);const messages=document.createElement("div");messages.className="messages";for(const message of item.messages){const line=document.createElement("div");line.className="message"+(message.from===auth.account?" mine":"");if(item.type==="group"){const sender=document.createElement("span");sender.className="sender";sender.textContent=message.from===auth.account?"You":await name(message.from);line.append(sender)}line.append(document.createTextNode(message.text));messages.append(line)}if(!item.messages.length)messages.innerHTML='<div class="empty">No messages yet.</div>';const composer=document.createElement("form"),input=document.createElement("input"),send=document.createElement("button");composer.className="composer";input.placeholder="Message";input.maxLength=2000;send.textContent="Send";composer.append(input,send);composer.onsubmit=async event=>{event.preventDefault();const text=input.value.trim();if(!text)return;input.value="";const common={text,id:crypto.randomUUID(),sentAt:Date.now()};if(item.type==="group")await manage("group_send",{...common,group:item.group.id});else await manage("send",{...common,target:item.account})};pane.append(header,messages);if(item.type==="group"&&item.group.owner===auth.account){const invite=document.createElement("form"),target=document.createElement("input"),button=document.createElement("button");invite.className="composer";target.placeholder="Invite public key";button.textContent="Invite";invite.append(target,button);invite.onsubmit=async event=>{event.preventDefault();if(target.value.trim())await manage("invite",{group:item.group.id,target:target.value.trim()})};pane.append(invite)}pane.append(composer);messages.scrollTop=messages.scrollHeight}
async function settingsRow(key,operation){const row=document.createElement("div"),code=document.createElement("code"),button=document.createElement("button");row.className="settings-row";code.textContent=await name(key)+" — "+key;button.className="secondary";button.textContent=operation==="unblock"?"Unblock":"Unmute";button.onclick=()=>manage(operation,{target:key});row.append(code,button);return row}
async function copyText(value){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(value);const area=document.createElement("textarea");area.value=value;area.style.position="fixed";area.style.opacity="0";document.body.append(area);area.select();document.execCommand("copy");area.remove()}
async function renderSettings(){const pane=$("pane"),currentName=await name(auth.account);pane.textContent="";const settings=document.createElement("div");settings.className="settings";settings.innerHTML='<div class="settings-inner"><h2>Account settings</h2><div class="settings-card"><h3>My public ID</h3><div class="settings-row"><code id="ownId"></code><button id="copyOwnId" class="secondary">Copy ID</button></div><p id="copyStatus" class="status"></p></div><div class="settings-card"><form id="profileForm"><label>Public account name</label><div class="composer"><input id="profileName" maxlength="32" pattern="[A-Za-z0-9_-]+"><button>Save</button></div><p id="settingsStatus" class="status"></p></form></div><div class="settings-card"><h3>Blocked accounts</h3><div id="blockedList"></div></div><div class="settings-card"><h3>Muted accounts</h3><div id="mutedList"></div></div><div class="settings-card"><button id="switchAccount" class="secondary">Switch account</button> <button id="logout" class="secondary">Log out</button></div></div>';pane.append(settings);$("ownId").textContent=auth.account;$("copyOwnId").onclick=async()=>{const status=$("copyStatus");try{await copyText(auth.account);status.textContent="Public ID copied."}catch(error){status.textContent="Could not copy: "+error.message}};$("profileName").value=currentName.includes("…")?"":currentName;$("profileForm").onsubmit=async event=>{event.preventDefault();const username=$("profileName").value.trim(),status=$("settingsStatus");try{status.textContent="Saving…";await client.invoke(profile.box,"set",{username,account:auth.account,grant:auth.profile.grant,signature:auth.profile.signature});status.textContent="Saved.";await render()}catch(error){status.textContent=error.message}};for(const key of state.blocked)$("blockedList").append(await settingsRow(key,"unblock"));for(const key of state.muted)$("mutedList").append(await settingsRow(key,"unmute"));if(!state.blocked.length)$("blockedList").textContent="None";if(!state.muted.length)$("mutedList").textContent="None";$("switchAccount").onclick=login;$("logout").onclick=()=>{localStorage.removeItem(grantKey);auth=null;login()}}
async function render(){const accountName=await name(auth.account);$("accountName").textContent=accountName;$("accountKey").textContent=auth.account;$("accountAvatar").textContent=accountName[0]?.toUpperCase()||"?";await renderHistory();if(settingsOpen)return renderSettings();return renderChat(chats().find(item=>item.id===activeChat))}
$("account").onclick=async()=>{settingsOpen=true;await render()};$("newChat").onclick=()=>$("newDialog").showModal();$("closeDialog").onclick=()=>$("newDialog").close();$("openDirect").onclick=async()=>{const key=$("newAccount").value.trim();if(!key)return;activeChat="direct:"+key;settingsOpen=false;$("newDialog").close();await render()};$("createGroup").onclick=async()=>{const name=$("newGroup").value.trim();if(!name)return;const group=crypto.randomUUID();activeChat="group:"+group;settingsOpen=false;$("newDialog").close();await manage("create_group",{group,name})};
let liveSubscriptions=[],renewTimer,refreshTimer;function resetReads(){for(const subscription of liveSubscriptions)subscription.close();clearTimeout(renewTimer);auth.reads=null;localStorage.setItem(grantKey,JSON.stringify(auth));location.reload()}function liveChange(){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{readChats().then(render).catch(error=>console.error(error))},50)}async function startLive(){for(const subscription of liveSubscriptions)subscription.close();liveSubscriptions=[];const options=(read,onChange)=>({authority:read.authority,grant:read.grant,grantSignature:read.signature,onChange,onReset:resetReads});liveSubscriptions.push(await client.subscribeState(messagesBox.box,"shared",messageKey,options(auth.reads.messages,liveChange)));liveSubscriptions.push(await client.subscribeState(groupsBox.box,"shared",groupKey,options(auth.reads.groups,liveChange)));const expires=Math.min(...liveSubscriptions.map(x=>x.expires));clearTimeout(renewTimer);renewTimer=setTimeout(()=>startLive().catch(error=>console.error(error)),Math.max(1000,expires-Date.now()-5000));await readChats();await render()}window.addEventListener("beforeunload",()=>{for(const subscription of liveSubscriptions)subscription.close();clearTimeout(renewTimer)});await ensureSharedReads();await refresh();await render();await startLive();
})().catch(error=>{document.body.textContent=error.message});
</script></body></html>
